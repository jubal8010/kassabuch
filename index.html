<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kassabuch</title>
<meta name="theme-color" content="#1c6a58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kassabuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style id="app-css">
/* Layout: mobile-first Kassabuch – one column, max 600px, fixed bottom tab bar, bottom sheets for forms */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e8ece7; --line:#d4dbd3;
  --ink:#16201b; --muted:#66746c; --accent:#1c6a58; --accent-ink:#ffffff; --accent-soft:#dbeae4;
  --warn:#a5600b; --warn-soft:#f7ead6; --neg:#ad3a2d; --neg-soft:#f6e2de;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 2px 8px rgba(22,32,27,.05);
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --f-num:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18201c; --surface-2:#212b26; --line:#2f3b35;
  --ink:#e5ebe7; --muted:#90a097; --accent:#5ec2a3; --accent-ink:#0d1a15; --accent-soft:#1c3a31;
  --warn:#e2a552; --warn-soft:#3a2c17; --neg:#ee877a; --neg-soft:#3e221e;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201c; --surface-2:#212b26; --line:#2f3b35;
  --ink:#e5ebe7; --muted:#90a097; --accent:#5ec2a3; --accent-ink:#0d1a15; --accent-soft:#1c3a31;
  --warn:#e2a552; --warn-soft:#3a2c17; --neg:#ee877a; --neg-soft:#3e221e;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.inp{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.add-btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;border-radius:99px;padding:9px 15px;white-space:nowrap;flex-shrink:0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 8px}
.sec-head h2{margin:0}
.sec-head .add-btn{padding:7px 13px;font-size:13px}
.store-chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.store-chip.cloud{background:var(--accent-soft);color:var(--accent)}

/* period segmented */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* KPI */
.kpi-main{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 18px;margin-top:12px}
.kpi-main .lbl{font-size:12px;font-weight:600;opacity:.8}
.kpi-main .val{font-family:var(--f-num);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi-main .sub{font-size:12px;opacity:.8;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi .lbl{font-size:11px;font-weight:600;color:var(--muted)}
.kpi .sub2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.kpi .sub2 b{font-weight:700}
.kpi .val{font-family:var(--f-num);font-size:17px;font-weight:600;margin-top:2px}
.pos{color:var(--accent)} .neg{color:var(--neg)} .warn{color:var(--warn)}

.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.act small{font-weight:500;color:var(--muted);font-size:11px}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.primary small{color:inherit;opacity:.7}

/* list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 13px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.tag{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800}
.tag.vk{background:var(--accent-soft);color:var(--accent)}
.tag.ek{background:var(--surface-2);color:var(--ink)}
.tag.aus{background:var(--neg-soft);color:var(--neg)}
.row-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{text-align:right}
.row-amt .num{font-size:14px;font-weight:600;display:block}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-top:2px}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--surface-2);color:var(--muted)}
.pill.ex{background:var(--surface-2);color:var(--muted);margin-left:4px}
.grp-head{padding:8px 13px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.grp-head:first-child{border-top:0}
.sortbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sortbar label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sortbar select{flex:1;min-width:0;padding:8px 10px}
.pill.top{background:var(--accent-soft);color:var(--accent)}
.pill.down{background:var(--neg-soft);color:var(--neg)}
.pill.slow{background:var(--surface-2);color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:96px}
.wk div{position:relative;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.wk div.z{background:var(--line)}
.wk span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10px;font-family:var(--f-num);color:var(--muted)}
.wk-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-family:var(--f-num);font-weight:600;text-align:right}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:72px;height:72px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:700;color:var(--muted);padding:0;text-align:center;line-height:1.2}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.add{border-style:dashed;cursor:pointer}
.picker .chips{margin-bottom:8px}
.tiles.mini{max-height:290px;overflow-y:auto;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));padding:8px 8px 2px 2px;margin:-6px -8px 0 -2px}
.tiles.mini .tile{min-height:76px;padding:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;min-height:96px;min-width:0}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile-n{font-weight:700;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-p{font-size:14px;font-weight:600;margin-top:auto}
.tile-s{font-size:11px;color:var(--muted)}
.tile-s.neg{color:var(--neg)}
.tile-q{position:absolute;top:-7px;right:-7px;background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(568px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:10px;z-index:45;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cartbar>span{flex:1;display:flex;flex-direction:column;font-size:13px;min-width:0}
.cartbar .num{font-size:17px;font-weight:600}
.cartbar .btn{background:var(--accent);color:var(--accent-ink)}
.cart-x{border:0;background:none;color:inherit;opacity:.7;font-size:16px;padding:6px}
.wrap.kasse{padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:700;color:var(--ink)}
.kasse-btn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px 16px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px}
.kasse-btn>span:first-child{text-align:left}
.kasse-btn small{font-weight:500;opacity:.7;font-size:12px}
.rep h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666;margin:18px 0 4px}
.rep td:first-child{white-space:normal}
.inv.rep{min-width:0}
.rep .inv-head{flex-wrap:wrap;gap:10px}
.rep .inv-head>div:last-child{margin-left:auto}
.rep td{padding-left:6px;padding-right:6px}
#main.kasse ~ #toastRoot .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.pill.ord{background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--neg-soft);color:var(--neg)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:10px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:9px;margin-bottom:12px;font-size:14px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 12px}

.items{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.item{background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 64px 90px 28px;gap:6px;align-items:end}
.item .inp{padding:8px 9px;font-size:14px}
.item .sum{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.item label{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.x{border:0;background:none;color:var(--muted);font-size:18px;height:36px}
.x:hover{color:var(--neg)}
.add-row{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;font-weight:600;color:var(--muted);margin-bottom:14px}
.add-row:hover{border-color:var(--accent);color:var(--accent)}

.summary{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.summary .l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 0}
.summary .l.big{font-size:16px;color:var(--ink);font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}

.btn{border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px;width:100%;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.steps{display:flex;align-items:flex-start;margin:4px 0 10px}
.steps .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);position:relative;text-align:center}
.steps .st i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font-size:12px;font-weight:700;position:relative;z-index:1}
.steps .st:not(:first-child)::before{content:'';position:absolute;top:12px;right:50%;width:100%;height:2px;background:var(--line)}
.steps .st.done{color:var(--ink)}
.steps .st.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .st.done:not(:first-child)::before{background:var(--accent)}
.btn.big{padding:15px 13px;font-size:17px}
.btn .sub{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px}
.done-banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:14px;font-weight:700;text-align:center;margin-bottom:14px}
.linkrow{display:flex;justify-content:center;gap:22px;margin:2px 0 12px}
.linkrow:empty{display:none}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:8px 2px}
.btn-row .btn{flex:1;min-width:120px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet-head h3{margin:0;font-size:18px;font-weight:800}
.close{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:99px;font-size:16px;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:flex}
.nav button{flex:1;min-width:0;border:0;background:none;padding:10px 1px 12px;font-size:10px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}

/* tables & charts */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--f-ui);font-weight:600}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.tap{cursor:pointer;position:relative;transition:transform .08s}
.tap:active{transform:scale(.98)}
.kpi.tap::after,.kpi-main.tap::after{content:'›';position:absolute;right:12px;top:8px;font-size:20px;font-weight:600;opacity:.45}
.chart-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:2px}
.chart-val{font-size:24px;font-weight:700;margin-top:2px}
.chart-side{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted);gap:2px;white-space:nowrap}
.chart-mini{font-size:12px;color:var(--muted);margin-bottom:12px}
button.bar-col{border:0;background:none;padding:0;border-radius:4px}
.bar-col.sel{background:var(--accent-soft)}
.bar-lbl span.on{color:var(--ink);font-weight:700}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px 8px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:120px;position:relative}
.bar-col{position:relative;height:100%}
.bar{position:absolute;left:12%;right:12%;border-radius:3px;background:var(--accent)}
.bar.n{background:var(--neg)}
.zero{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.bar-lbl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.w{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card p{margin:0 0 8px;font-size:14px}
.card p:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.cat-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-list span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:5px 6px 5px 11px;font-size:13px;font-weight:600}
.cat-list button{border:0;background:var(--surface);border-radius:99px;width:20px;height:20px;font-size:12px;color:var(--muted);line-height:1}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}

/* invoice preview */
.inv-frame{background:#fff;color:#1b1b1b;border-radius:10px;padding:22px 18px;margin-bottom:14px;overflow-x:auto;border:1px solid var(--line)}
.inv{font-family:var(--f-ui);font-size:12.5px;line-height:1.5;color:#1b1b1b;min-width:440px}
.inv-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:26px}
.inv-from{font-size:11px;color:#555}
.inv-from b{display:block;font-size:15px;color:#1b1b1b}
.inv-title{font-size:20px;font-weight:800;letter-spacing:-.01em;text-align:right}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const r2=n=>Math.round((+n||0)*100)/100;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const EUR=new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(r2(n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fdate=d=>{if(!d)return'';const[y,m,t]=d.split('-');return `${t}.${m}.${y}`};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MONTHS=['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const METHODS={bar:'Bar',ueb:'Überweisung',karte:'Karte',paypal:'PayPal',sonst:'Sonstiges'};
const TYPES={verkauf:'Verkauf',einkauf:'Einkauf',ausgabe:'Ausgabe'};

const DEF={owner:'',company:'',address:'',email:'',phone:'',uidNr:'',iban:'',
  kleinunternehmer:true,limit:55000,defaultTax:20,lowStock:3,leadTime:7,coverDays:30,
  categories:['Allgemein'],expenseCats:['Versand','Verpackung','Gebühren','Werbung','Material','Sonstiges'],
  invoiceYear:new Date().getFullYear(),nextInvoice:1,payDays:14,payTerms:'Zahlbar innerhalb von 14 Tagen ohne Abzug.'};

const S={settings:{...DEF},products:[],entries:[],customers:[],suppliers:[],recurring:[]};
const UI={lblFmt:(()=>{try{return localStorage.getItem('kb_lblfmt')||'a6'}catch{return'a6'}})(),ktab:'kunde',cart:[],kq:'',kcat:'alle',kpay:'bar',kparty:'',remTone:(()=>{try{return localStorage.getItem('kb_tone')||'du'}catch{return'du'}})(),cq:'',pq:'',pcat:'alle',psort:(()=>{try{return localStorage.getItem('kb_psort')||'kat'}catch{return'kat'}})(),screen:'start',period:'monat',filter:'alle',q:'',lagerCat:'alle',year:new Date().getFullYear(),ready:false};
const LKEY='kassabuch_v1';

/* ---------- storage: cloud (db) with local fallback ---------- */
const Store={
  mode:'local',base:null,downloads:null,got:{s:false,p:false,e:false},
  loadLocal(){try{const v=JSON.parse(localStorage.getItem(LKEY)||'null');if(v){S.settings={...DEF,...v.settings};S.products=v.products||[];S.entries=v.entries||[];S.customers=v.customers||[];S.suppliers=v.suppliers||[];S.recurring=v.recurring||[]}}catch{}},
  saveLocal(){if(this.mode!=='local')return;try{localStorage.setItem(LKEY,JSON.stringify(S));saveWarn(false)}catch(e){console.error(e);saveWarn(true)}},
  async connect(){
    this.loadLocal();this.downloads=true;UI.ready=true;
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
    try{localStorage.setItem('kb_test','1');localStorage.removeItem('kb_test')}catch{saveWarn(true)}
    render();
    try{const n=await runRecurring();if(n)toast(n===1?'1 wiederkehrende Ausgabe gebucht':n+' wiederkehrende Ausgaben gebucht')}catch(e){console.error(e)}
    setTimeout(()=>cleanupFiles().catch(()=>{}),3000);
  },
  batching:false,
  async bulk(fn){this.batching=true;try{await fn()}finally{this.batching=false;this.saveLocal();render()}},
  async put(col,obj,keepStamp){
    const clean=JSON.parse(JSON.stringify(obj));
    if(!(keepStamp&&clean.updated))clean.updated=new Date().toISOString();
    if(this.mode==='cloud'){
      try{await this.base.collection(col).doc(obj.id).set(clean)}catch(e){toast(e.code==='quota_exceeded'?'Speicher voll – bitte alte Einträge löschen.':'Speichern fehlgeschlagen. Bitte erneut versuchen.');throw e}
    }else{const a=S[col];const i=a.findIndex(x=>x.id===obj.id);i>=0?a[i]=clean:a.push(clean);if(!this.batching){this.saveLocal();render()}}
  },
  async del(col,id){
    if(this.mode==='cloud'){try{await this.base.collection(col).doc(id).delete()}catch{toast('Löschen fehlgeschlagen.');}}
    else{S[col]=S[col].filter(x=>x.id!==id);if(!this.batching){this.saveLocal();render()}}
  },
  async setSettings(s){
    S.settings={...s};
    if(this.mode==='cloud'){try{await this.base.set(JSON.parse(JSON.stringify(s)))}catch{toast('Einstellungen konnten nicht gespeichert werden.')}}
    else{this.saveLocal()}
    render();
  },
  async save(name,data){
    const ext=name.split('.').pop().toLowerCase();
    const type={csv:'text/csv',json:'application/json',html:'text/html',pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png'}[ext]||'application/octet-stream';
    const blob=data instanceof Blob?data:new Blob([data],{type:type+(type.startsWith('text')||type.endsWith('json')?';charset=utf-8':'')});
    try{
      const file=new File([blob],name,{type});
      if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}
    }catch(e){if(e&&e.name==='AbortError')return false}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
  }
};

/* ---------- calculations ---------- */
const prodById=id=>S.products.find(p=>p.id===id);
function stockMap(asOf){
  const m={};S.products.forEach(p=>m[p.id]=num(p.stockStart));
  S.entries.forEach(e=>{if(e.delivered===false)return;if(asOf&&e.date>asOf)return;(e.items||[]).forEach(i=>{if(!(i.pid in m))return;if(e.type==='verkauf')m[i.pid]-=num(i.qty);if(e.type==='einkauf')m[i.pid]+=num(i.qty)})});
  return m;
}
function pendingMap(){
  const inc={},res={};
  S.entries.forEach(e=>{if(e.delivered!==false||e.cancelled||e.storno)return;(e.items||[]).forEach(i=>{const t=e.type==='einkauf'?inc:res;t[i.pid]=(t[i.pid]||0)+num(i.qty)})});
  return{inc,res};
}
const KIND={kunde:{col:'customers',type:'verkauf',one:'Kunde',many:'Kunden'},lieferant:{col:'suppliers',type:'einkauf',one:'Lieferant',many:'Lieferanten'}};
const live=e=>!e.cancelled&&!e.storno;
const pf=e=>{const sub=(e.items||[]).reduce((s,i)=>s+num(i.qty)*num(i.price),0);const it=num(e.total)-num(e.extra);return sub>0.005&&it>=0?it/sub:1};
const stage=e=>e.delivered===false?(e.ready?'fertig':'geplant'):'uebergeben';
const STAGE_PILL=e=>e.type==='verkauf'?(e.ready?'<span class="pill top">Fertig</span>':'<span class="pill ord">Geplant</span>'):'<span class="pill ord">Bestellt</span>';
const norm=n=>String(n||'').trim().toLowerCase();
const recByName=(kind,n)=>S[KIND[kind].col].find(c=>norm(c.name)===norm(n));
const custByName=n=>recByName('kunde',n);
function partyList(kind){
  const K=KIND[kind],m={};
  const get=n=>{const k=norm(n);return m[k]=m[k]||{name:n.trim(),rec:null,entries:[],n:0,umsatz:0,offen:0,bestellt:0,last:''}};
  S[K.col].forEach(c=>{get(c.name).rec=c});
  S.entries.forEach(e=>{if(e.type!==K.type||!e.party)return;const c=get(e.party);c.entries.push(e);
    if(e.delivered===false){if(live(e))c.bestellt++}
    else{if(live(e))c.n++;c.umsatz+=num(e.total);c.offen+=openAmt(e)}
    if(e.date>c.last)c.last=e.date});
  Object.values(m).forEach(c=>{if(c.rec)c.name=c.rec.name;c.offen=r2(c.offen);c.umsatz=r2(c.umsatz)});
  return Object.values(m);
}
const customerList=()=>partyList('kunde');
/* payments */
const paysOf=e=>Array.isArray(e.payments)?e.payments:(e.paid?[{date:e.date,amount:num(e.total),method:e.method}]:[]);
const paidSum=e=>r2(paysOf(e).reduce((s,p)=>s+num(p.amount),0));
const openAmt=e=>r2(num(e.total)-paidSum(e));
const isPaid=e=>num(e.total)>=0?openAmt(e)<=0.005:openAmt(e)>=-0.005;
const isPartial=e=>!isPaid(e)&&Math.abs(paidSum(e))>0.005;
function dueDate(e){const d=new Date(new Date((e.invoiceDate||e.date)+'T12:00:00').getTime()+num(S.settings.payDays??14)*864e5);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
const isOverdue=e=>e.type==='verkauf'&&live(e)&&e.delivered!==false&&openAmt(e)>0.005&&dueDate(e)<today();
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function nextInvoiceNo(){
  const st=S.settings;const y=new Date().getFullYear();let n=st.invoiceYear===y?num(st.nextInvoice)||1:1;
  const used=new Set(S.entries.map(x=>x.invoiceNo).filter(Boolean));let no;do{no=`${y}-${String(n).padStart(3,'0')}`;n++}while(used.has(no));
  return{no,settings:{...st,invoiceYear:y,nextInvoice:n}};
}
const DAY=864e5;
const dayT=d=>new Date(d+'T12:00:00').getTime();
const addDays=n=>{const d=new Date(Date.now()+n*DAY);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function productStats(p,sm,pm){
  const st=S.settings,now=dayT(today())+DAY/2;
  sm=sm||stockMap();pm=pm||pendingMap();
  const sales=[];let firstMove=Infinity;
  S.entries.forEach(e=>{(e.items||[]).forEach(i=>{if(i.pid!==p.id)return;const t=dayT(e.date);if(t<firstMove)firstMove=t;
    if(e.type==='verkauf'&&e.delivered!==false)sales.push({t,qty:num(i.qty),rev:num(i.qty)*num(i.price)*pf(e),cogs:num(i.qty)*num(i.ek),party:e.party||'Laufkunde'})})});
  const age=isFinite(firstMove)?Math.max(1,Math.round((now-firstMove)/DAY)):0;
  const win=Math.min(90,Math.max(14,age));
  const sumQ=(from,to)=>sales.filter(x=>x.t>now-from*DAY&&x.t<=now-to*DAY).reduce((a,x)=>a+x.qty,0);
  const q30=sumQ(30,0),q30p=sumQ(60,30),qWin=sumQ(win,0);
  const rate=qWin/win;
  const stock=sm[p.id]||0,res=pm.res[p.id]||0,inc=pm.inc[p.id]||0,avail=stock-res;
  const lead=num(st.leadTime??7),cover=num(st.coverDays??30),low=num(p.low??st.lowStock);
  const rop=rate*lead+low;
  const need=avail+inc<=rop;
  const reach=rate>0?avail/rate:Infinity;
  const daysToOrder=rate>0?Math.floor((avail+inc-rop)/rate):Infinity;
  const suggest=Math.max(0,Math.ceil(rate*(lead+cover)+low-avail-inc))||(need?Math.max(1,low+1-avail-inc):0);
  const trend=q30p>0?(q30-q30p)/q30p:(q30>0?null:0);
  const weeks=Array.from({length:12},(_,k)=>sales.filter(x=>x.t>now-(12-k)*7*DAY&&x.t<=now-(11-k)*7*DAY).reduce((a,x)=>a+x.qty,0));
  const last=sales.length?Math.max(...sales.map(x=>x.t)):null;
  const since=last?Math.round((now-last)/DAY):null;
  const tot=sales.reduce((a,x)=>({q:a.q+x.qty,rev:a.rev+x.rev,cogs:a.cogs+x.cogs}),{q:0,rev:0,cogs:0});
  const cust={};sales.forEach(x=>{cust[x.party]=(cust[x.party]||0)+x.qty});
  const enough=sales.length>=2&&age>=7;
  let status='stabil';
  if(!sales.length)status=stock>0&&age>=30?'ladenhueter':'neu';
  else if(stock>0&&since>=60)status='ladenhueter';
  else if(trend===null&&q30>=2)status='steigend';
  else if(trend!==null&&trend>=0.25&&q30>=3)status='steigend';
  else if(trend!==null&&trend<=-0.3)status='sinkend';
  return{sales,age,win,q30,q30p,rate,stock,res,inc,avail,lead,cover,low,rop,need,reach,daysToOrder,suggest,trend,weeks,last,since,tot,cust,enough,status};
}
const STATUS={steigend:['top','Läuft gut ↑'],sinkend:['down','Läuft schwächer ↓'],stabil:['slow','Stabil'],ladenhueter:['down','Ladenhüter'],neu:['slow','Noch keine Verkäufe']};
const fmtTrend=t=>t===null?'vorher 0':t===0?'±0 %':(t>0?'+':'−')+Math.round(Math.abs(t)*100)+' %';
const fmtReach=r=>!isFinite(r)?'–':r<=0?'leer':r<1?'< 1 Tag':r>365?'über 1 Jahr':'ca. '+Math.round(r)+' Tage';
function orderText(ps){
  if(ps.need)return ps.inc?'jetzt (trotz Bestellung)':'jetzt';
  if(!isFinite(ps.daysToOrder)||ps.daysToOrder>180)return 'nicht absehbar';
  return ps.daysToOrder<=0?'jetzt':'ca. '+fdate(addDays(ps.daysToOrder));
}
function openProductStats(id){
  const p=prodById(id);if(!p)return;const ps=productStats(p);
  const [cls,lbl]=STATUS[ps.status];const max=Math.max(1,...ps.weeks);
  const avg=ps.tot.q?ps.tot.rev/ps.tot.q:0;
  const topc=Object.entries(ps.cust).sort((a,b)=>b[1]-a[1]).slice(0,3);
  openSheet(p.name,`
   <p style="margin:-6px 0 12px" class="muted">${esc(p.cat||'Allgemein')} · VK ${eur(p.vk)} · EK ${eur(p.ek)}${p.vk>0?' · '+Math.round((p.vk-p.ek)/p.vk*100)+' % Marge':''} <span class="pill ${cls}">${lbl}</span></p>
   ${ps.need?`<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>Nachbestellen empfohlen: <b>${ps.suggest} ${esc(p.unit||'Stk')}</b></span><button class="btn sm" data-act="reorder" data-id="${p.id}">Bestellung anlegen</button></div>`:''}
   <div class="kpis" style="margin:0 0 12px">
    <div class="kpi"><div class="lbl">Bestand${ps.res?' (frei)':''}</div><div class="val ${ps.avail<=ps.low?'neg':''}">${ps.avail}${ps.res?` <small class="muted" style="font-size:12px">von ${ps.stock}</small>`:''}</div></div>

function inPeriod(d,p){const t=today();if(p==='monat')return d.slice(0,7)===t.slice(0,7);if(p==='jahr')return d.slice(0,4)===t.slice(0,4);return true}
function totals(pred){
  const t={ein:0,aus:0,warenAus:0,umsatz:0,cogs:0,offenFord:0,offenVerb:0,n:0,exp:{}};
  S.entries.forEach(e=>{
    const del=e.delivered!==false,amt=num(e.total);
    paysOf(e).forEach(p=>{if(!pred(p.date))return;const a=num(p.amount);
      if(e.type==='verkauf')t.ein+=a;else{t.aus+=a;if(e.type==='einkauf')t.warenAus+=a;else{const k=e.expenseCat||'Sonstiges';t.exp[k]=(t.exp[k]||0)+a}}});
    if(!del||!pred(e.date))return;
    if(e.type==='verkauf'){t.umsatz+=amt;t.cogs+=num(e.cogs);if(live(e))t.n++;t.offenFord+=openAmt(e)}
    else t.offenVerb+=openAmt(e);
  });
  t.ueber=t.ein-t.aus;t.roh=t.umsatz-t.cogs;return t;
}
function taxBreakdown(e){
  // prices are gross; returns [{rate,gross,net,tax}]
  const sub=(e.items||[]).reduce((s,i)=>s+num(i.qty)*num(i.price),0)+num(e.extra);
  const f=sub>0?num(e.total)/sub:1;const g={};
  (e.items||[]).forEach(i=>{const r=num(i.tax);g[r]=(g[r]||0)+num(i.qty)*num(i.price)*f});
  if(num(e.extra))g[S.settings.defaultTax]=(g[S.settings.defaultTax]||0)+num(e.extra)*f;
  return Object.keys(g).map(r=>{const gross=r2(g[r]);const net=r2(gross/(1+r/100));return{rate:+r,gross,net,tax:r2(gross-net)}}).sort((a,b)=>b.rate-a.rate);
}

  return{street:rest.pop()||'',extra:rest.join(', '),zip,city,country};
}

function drawLabel(doc,L,ox,oy){
  const W=100,H=150,M=6,PT=0.3528;
  const T=(str,x,y,size,style='normal',color=17,opt={})=>{doc.setFont('helvetica',style);doc.setFontSize(size);doc.setTextColor(color);doc.text(pdfTxt(str),ox+x,oy+y,opt)};
  const fit=(str,maxW,size,min,style)=>{doc.setFont('helvetica',style);let s=size;doc.setFontSize(s);while(s>min&&doc.getTextWidth(pdfTxt(str))>maxW){s-=0.5;doc.setFontSize(s)}return s};
  const wrap=(str,maxW,size,style)=>{doc.setFont('helvetica',style);doc.setFontSize(size);return doc.splitTextToSize(pdfTxt(str),maxW)};
  // Absender
  T('ABSENDER',M,M+2.5,6.5,'bold',110);
  let y=M+7.5;const fw=W-2*M;let maxW=doc.getTextWidth('ABSENDER');
  [[L.fromName,9.5,'bold'],[L.fromStreet,9,'normal'],[[L.fromZip,L.fromCity].filter(Boolean).join(' '),9,'normal'],[isAT(L.fromCountry)?'':L.fromCountry,9,'normal']].forEach(([t,sz,st])=>{
    if(!t)return;wrap(t,fw,sz,st).slice(0,2).forEach(l=>{T(l,M,y,sz,st);maxW=Math.max(maxW,doc.getTextWidth(l));y+=sz*PT*1.25})});
  if(L.xFrom){const x1=ox+M-1.5,y1=oy+M-0.5,x2=ox+M+maxW+1.5,y2=oy+y-2.2;doc.setDrawColor(180);doc.setLineWidth(0.3);doc.line(x1,y1,x2,y2);doc.line(x2,y1,x1,y2)}
  // Empfänger-Box
  const bx=M,by=Math.max(y+4,34),bw=W-2*M,bh=H-M-9-by;
  doc.setDrawColor(17);doc.setLineWidth(0.6);doc.roundedRect(ox+bx,oy+by,bw,bh,2,2,'S');
  const iw=bw-12,lines=[];
  let nameSz=fit(L.toName||'-',iw,21,15,'bold');if(doc.getTextWidth(pdfTxt(L.toName||'-'))>iw){nameSz=17;while(nameSz>11&&wrap(L.toName,iw,nameSz,'bold').length>2)nameSz-=0.5}
  wrap(L.toName||'-',iw,nameSz,'bold').slice(0,2).forEach(t=>lines.push([t,nameSz,'bold',0]));
  if(L.toExtra)wrap(L.toExtra,iw,14,'normal').slice(0,2).forEach(t=>lines.push([t,14,'normal',0]));
  if(L.toStreet)wrap(L.toStreet,iw,15,'normal').slice(0,2).forEach(t=>lines.push([t,15,'normal',0]));
  const citySz=fit((L.toZip||'')+'  '+(L.toCity||''),iw,18,11,'bold');lines.push(['__city',citySz,'bold',1]);
  if(!isAT(L.toCountry)&&L.toCountry){const c=String(L.toCountry).toUpperCase();lines.push([c,fit(c,iw,18,11,'bold'),'bold',1])}
  const lh=l=>l[1]*PT*1.3+(l[3]?1.2:0);
  const blockH=6+lines.reduce((s,l)=>s+lh(l),0);
  let cy=by+Math.max(9,(bh-blockH)/2+2);
  T('EMPFÄNGER',bx+6,cy,6.5,'bold',110);cy+=4.5;
  lines.forEach(l=>{cy+=l[1]*PT*1.05+(l[3]?1.2:0);
    if(l[0]==='__city'){doc.setFont('helvetica','bold');doc.setFontSize(l[1]);T(L.toZip||'',bx+6,cy,l[1],'bold');const zw=doc.getTextWidth(pdfTxt((L.toZip||'')+'  '));T(L.toCity||'',bx+6+zw,cy,l[1],'normal')}
    else T(l[0],bx+6,cy,l[1],l[2]);
    cy+=l[1]*PT*0.25});
  // Datum
  T(fdate(today()),W-M,H-M-1,8.5,'normal',90,{align:'right'});
}

    if(p){cartAdd(p.id);render();toast(p.name+' hinzugefügt')}
    else ask(`Kein Produkt mit Code ${code}. Jetzt anlegen?`,'Anlegen').then(ok=>{if(ok)openProduct(null,{ean:code})});
    return}
  if(target==='form'&&F){
    if(!p){toast('Kein Produkt mit Code '+code);return}
    const row=F.items.find(i=>i.pid===p.id);
    if(row)row.qty=num(row.qty)+1;else{const empty=F.items.find(i=>!i.pid);const it={pid:p.id,qty:1,price:F.type==='verkauf'?p.vk:p.ek};if(empty)Object.assign(empty,it);else F.items.push(it)}
    renderEntryForm();toast(p.name+' hinzugefügt')}
}

function ask(msg,ok='Löschen'){return new Promise(res=>{
  const root=document.createElement('div');root.className='overlay';root.style.zIndex=70;root.style.alignItems='center';
  root.innerHTML=`<div class="sheet" style="border-radius:16px;max-width:380px;margin:16px"><p style="margin:0 0 16px;font-weight:600">${esc(msg)}</p><div class="btn-row"><button class="btn ghost" data-r="0">Abbrechen</button><button class="btn danger" data-r="1">${esc(ok)}</button></div></div>`;

function formCalc(){
  if(F.type==='ausgabe')return{total:r2(num(F.amount))};
  const sub=r2(F.items.reduce((s,i)=>s+num(i.qty)*num(i.price),0));
  if(F.type==='einkauf')return{sub,total:sub};
  const regular=r2(sub+num(F.extra));
  const total=String(F.override).trim()!==''?r2(num(F.override)):regular;
  const cogs=r2(F.items.reduce((s,i)=>s+num(i.qty)*num(i.ek??prodById(i.pid)?.ek),0));
  return{sub,regular,total,discount:r2(regular-total),cogs};
}
function updateSummary(){
  const c=formCalc(),el=$('#fsum');if(!el)return;
  F.items.forEach((it,i)=>{const r=$('#rs'+i);if(r)r.textContent=eur(num(it.qty)*num(it.price));
    const m=$('#rm'+i),vk=num(prodById(it.pid)?.vk);if(m&&F.type==='einkauf'&&it.pid&&vk)m.textContent='VK '+eur(vk)+' · Marge '+Math.round((vk-num(it.price))/vk*100)+' %'});
  if(F.type==='verkauf'){
    el.innerHTML=`<div class="l"><span>Positionen</span><span class="num">${eur(c.sub)}</span></div>
    ${num(F.extra)?`<div class="l"><span>Versand / Service</span><span class="num">${eur(F.extra)}</span></div>`:''}
    ${c.discount?`<div class="l"><span>${c.discount>0?'Rabatt':'Aufschlag'}</span><span class="num ${c.discount>0?'neg':''}">${c.discount>0?'−':'+'}${eur(Math.abs(c.discount))}</span></div>`:''}
    <div class="l"><span>Wareneinsatz (EK)</span><span class="num">${eur(c.cogs)}</span></div>
    <div class="l big"><span>Gesamt</span><span class="num">${eur(c.total)}</span></div>
    <div class="l"><span>Rohertrag</span><span class="num ${c.total-c.cogs>=0?'pos':'neg'}">${eur(c.total-c.cogs)}</span></div>`;
  }else if(F.type==='einkauf'){const vw=r2(F.items.reduce((s,i)=>s+num(i.qty)*num(prodById(i.pid)?.vk),0));
    el.innerHTML=`<div class="l big"><span>Einkaufssumme</span><span class="num">${eur(c.total)}</span></div>
    <div class="l"><span>Verkaufswert (VK)</span><span class="num">${eur(vw)}</span></div>
    <div class="l"><span>Möglicher Rohertrag</span><span class="num ${vw-c.total>=0?'pos':'neg'}">${eur(vw-c.total)}${vw>0?' · '+Math.round((vw-c.total)/vw*100)+' %':''}</span></div>`;
  }else el.innerHTML=`<div class="l big" style="border:0;margin:0;padding:0"><span>Ausgabe</span><span class="num">${eur(c.total)}</span></div>`;

async function saveEntry(){
  const c=formCalc();
  if(F.type!=='ausgabe'){F.items=F.items.filter(i=>i.pid&&num(i.qty)>0);if(!F.items.length){toast('Bitte mindestens ein Produkt mit Menge angeben.');F.items.push({pid:'',qty:1,price:0});renderEntryForm();return}}
  else if(!(c.total>0)){toast('Bitte einen Betrag eingeben.');return}
  if(!F.date){toast('Bitte ein Datum wählen.');return}
  const old=F.id?S.entries.find(e=>e.id===F.id):null;
  const e={...(old||{}),id:F.id||F.newId,created:old?.created||new Date().toISOString(),type:F.type,date:F.date,party:F.party.trim(),
    method:F.method,note:F.note.trim(),total:c.total,sample:old?.sample||false,att:F.att||[]};
  if(F.type==='verkauf'){e.delivered=F.stage==='uebergeben';e.ready=F.stage==='fertig';if(!e.ready)delete e.ready}
  else if(F.type==='einkauf'){e.delivered=!!F.delivered;delete e.ready}
  if(F.type==='ausgabe'){e.expenseCat=F.expenseCat;delete e.items}
  else{
    e.items=F.items.map(i=>{const p=prodById(i.pid);return{pid:i.pid,name:i.name||p?.name||'?',qty:num(i.qty),price:r2(num(i.price)),ek:r2(F.type==='verkauf'?num(i.ek??p?.ek):num(i.price)),tax:i.tax??(S.settings.kleinunternehmer?0:num(p?.tax??S.settings.defaultTax)),unit:i.unit||p?.unit||'Stk'}});
    if(F.type==='verkauf'){Object.assign(e,{partyAddress:F.partyAddress.trim(),extra:r2(num(F.extra)),regular:c.regular,discount:c.discount,cogs:c.cogs})}
  }
  const prev=old?paysOf(old).map(p=>({...p})):[];let pays;
  if(F.payStatus==='1'){pays=prev;const rest=r2(c.total-pays.reduce((s,p)=>s+num(p.amount),0));if(Math.abs(rest)>0.005)pays.push({date:prev.length?today():F.date,amount:rest,method:F.method})}
  else if(F.payStatus==='p')pays=prev;else pays=[];
  e.payments=pays;e.paid=isPaid(e);
  try{await Store.put('entries',e)}catch{return}
  const kind=e.type==='verkauf'?'kunde':e.type==='einkauf'?'lieferant':null;
  if(kind&&e.party){const r=recByName(kind,e.party);const addr=(e.partyAddress||'').trim();
    if(!r)await Store.put(KIND[kind].col,{id:newId(),name:e.party,address:addr,phone:'',email:'',note:''}).catch(()=>{});
    else if(addr&&!r.address)await Store.put(KIND[kind].col,{...r,address:addr}).catch(()=>{});}
  if(F.type==='einkauf'&&F.updateEk){for(const i of e.items){const p=prodById(i.pid);if(p&&num(p.ek)!==i.price){try{await Store.put('products',{...p,ek:i.price})}catch{}}}}
  closeSheet();toast(old?'Gespeichert':e.delivered===false?'Bestellung aufgenommen':TYPES[e.type]+' gebucht');
}

async function stornoEntry(id){

  if(!await ask(`Rechnung ${e.invoiceNo} stornieren? Es wird eine Stornorechnung mit neuer Nummer erstellt${e.delivered!==false?', die Ware geht zurück ins Lager':''}.`,'Stornieren'))return;
  const n=nextInvoiceNo();
  const s={id:newId(),created:new Date().toISOString(),type:'verkauf',storno:true,refId:e.id,refInvoice:e.invoiceNo,refDate:e.invoiceDate||e.date,
    date:today(),invoiceDate:today(),invoiceNo:n.no,party:e.party,partyAddress:e.partyAddress||'',method:e.method,delivered:e.delivered!==false,
    items:(e.items||[]).map(i=>({...i,qty:-num(i.qty)})),extra:-num(e.extra),discount:-num(e.discount),regular:-num(e.regular),total:-num(e.total),cogs:-num(e.cogs),

  s.paid=isPaid(s);
  await Store.bulk(async()=>{await Store.put('entries',s);await Store.put('entries',{...e,cancelled:true,cancelledBy:s.id,cancelNo:n.no})});

}

  const who=st.owner||st.company||'',first=(e.party||'').trim().split(/\s+/)[0]||'';

   ?`Hallo ${first},\n\nkurze Erinnerung: ${ref} ist seit ${fdate(dueDate(e))} fällig.${part?` Bisher sind ${eur(paid)} bezahlt.`:''} Offen sind noch ${eur(open)}.\n\nBitte überweise den Betrag${acc}${vz}. Falls du schon bezahlt hast, ignorier diese Nachricht einfach.\n\nDanke dir & liebe Grüße\n${who}`

/* attachments */
const IDB={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('kassabuch',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files',mode);const rq=fn(t.objectStore('files'));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error)})},
  put(f){return this.run('readwrite',s=>s.put(f))},get(id){return this.run('readonly',s=>s.get(id))},del(id){return this.run('readwrite',s=>s.delete(id))},all(){return this.run('readonly',s=>s.getAll())}};
const attThumbs=att=>(att||[]).map(a=>`<button class="thumb" data-act="view-att" data-id="${a.id}" aria-label="Beleg ansehen">${a.type==='application/pdf'?'PDF':`<img data-att="${a.id}" alt="">`}</button>`).join('');
function fillThumbs(){document.querySelectorAll('img[data-att]:not([src])').forEach(async img=>{try{const f=await IDB.get(img.dataset.att);if(f)img.src=f.data}catch{}})}
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function compressImage(file){
  const url=await readURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.72)}catch{return url}
}
async function storeFiles(files,entryId){
  const out=[];
  for(const f of files){
    if(f.type!=='application/pdf'&&!f.type.startsWith('image/')){toast('Nur Fotos und PDFs möglich.');continue}
    if(f.type==='application/pdf'&&f.size>8e6){toast('PDF ist zu groß (max. 8 MB).');continue}
    const data=f.type==='application/pdf'?await readURL(f):await compressImage(f);
    const meta={id:newId(),name:f.name||'Beleg',type:f.type==='application/pdf'?'application/pdf':'image/jpeg'};
    try{await IDB.put({...meta,entryId,data,created:new Date().toISOString()});out.push(meta)}catch{toast('Beleg konnte nicht gespeichert werden – Speicher voll?')}
  }
  return out;
}
const dataToBlob=d=>{const[h,b]=d.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})};

  const root=document.createElement('div');root.className='overlay';root.style.zIndex=85;root.style.alignItems='center';
  root.innerHTML=`<div class="sheet" style="border-radius:16px;margin:16px;max-width:560px"><div class="sheet-head"><h3>${esc(f.name)}</h3><button class="close" data-v="close" aria-label="Schließen">✕</button></div>
   ${f.type==='application/pdf'?'<p class="muted">PDF-Beleg – über „Teilen / Sichern“ öffnen.</p>':`<img src="${f.data}" alt="Beleg" style="width:100%;border-radius:10px;margin-bottom:12px">`}
   <div class="btn-row"><button class="btn" data-v="share">Teilen / Sichern</button><button class="btn danger" data-v="del">Löschen</button></div></div>`;

function annualData(y){
  const ys=String(y),pred=d=>String(d).startsWith(ys),end=ys+'-12-31',t=totals(pred),ku=S.settings.kleinunternehmer;
  let ust=0,vst=0;
  if(!ku)S.entries.forEach(e=>{if(e.type==='ausgabe')return;const tb=taxBreakdown(e);const g=tb.reduce((s,x)=>s+x.gross,0),tx=tb.reduce((s,x)=>s+x.tax,0);if(!g)return;
    paysOf(e).forEach(p=>{if(!pred(p.date))return;if(e.type==='verkauf')ust+=num(p.amount)*tx/g;else vst+=num(p.amount)*tx/g})});
  const asOf=end<today()?end:today();
  const sm=stockMap(asOf);const stockVal=S.products.reduce((s,p)=>s+Math.max(0,sm[p.id]||0)*num(p.ek),0);
  let ford=0,verb=0;
  S.entries.forEach(e=>{if(e.delivered===false||e.date>asOf)return;const o=num(e.total)-paysOf(e).filter(p=>p.date<=asOf).reduce((s,p)=>s+num(p.amount),0);if(e.type==='verkauf')ford+=o;else verb+=o});
  const inv=S.entries.filter(e=>e.invoiceNo&&e.invoiceNo.startsWith(ys+'-')).sort((a,b)=>a.invoiceNo.localeCompare(b.invoiceNo));
  const months=MONTHS.map((n,i)=>({n,t:totals(d=>String(d).startsWith(ys+'-'+pad(i+1)))}));
  return{ys,t,ust,vst,asOf,stockVal,ford,verb,inv,months,ku};
}

const STEP={monat:1,quartal:3,jahr:12},INTERVALS={monat:'monatlich',quartal:'vierteljährlich',jahr:'jährlich'};
function addMonthsKeep(d,m,day){const[y,mo]=d.split('-').map(Number);const t=new Date(y,mo-1+m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(day,last))}`}
const nextRun=r=>r.last?addMonthsKeep(r.last,STEP[r.interval]||1,+r.start.slice(8,10)):r.start;
async function runRecurring(){
  let n=0;const t=today();const due=S.recurring.filter(r=>r.active!==false&&r.start&&nextRun(r)<=t);
  if(!due.length)return 0;
  await Store.bulk(async()=>{
    for(const r0 of due){const r={...r0};let d=nextRun(r),guard=0;
      while(d<=t&&guard++<120){const id=`rec-${r.id}-${d}`;
        if(!S.entries.some(e=>e.id===id)){await Store.put('entries',{id,created:new Date().toISOString(),type:'ausgabe',date:d,party:r.name,expenseCat:r.cat,method:r.method,note:'Wiederkehrend ('+INTERVALS[r.interval]+')',total:r2(r.amount),
          payments:r.paid===false?[]:[{date:d,amount:r2(r.amount),method:r.method}],paid:r.paid!==false,recurringId:r.id,att:[]});n++}
        r.last=d;d=nextRun(r)}
      await Store.put('recurring',r)}
  });
  return n;
}

function choose(msg,opts){return new Promise(res=>{
  const root=document.createElement('div');root.className='overlay';root.style.zIndex=70;root.style.alignItems='center';
  root.innerHTML=`<div class="sheet" style="border-radius:16px;max-width:400px;margin:16px"><p style="margin:0 0 14px;font-weight:600">${esc(msg)}</p>${opts.map(([k,l,d],i)=>`<button class="btn ${i?'ghost':''}" style="margin-bottom:8px;text-align:left" data-r="${k}">${esc(l)}<small style="display:block;font-weight:500;opacity:.8;font-size:12px;margin-top:2px">${esc(d)}</small></button>`).join('')}<button class="btn ghost" data-r="">Abbrechen</button></div>`;
  root.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b||e.target===root){root.remove();res(b?b.dataset.r:'')}});
  document.body.appendChild(root);

async function importJSON(file){
  let data;try{data=JSON.parse(await file.text());if(!Array.isArray(data.entries)||!Array.isArray(data.products))throw 0}catch{toast('Diese Datei ist kein gültiges Backup.');return}
  const nf=(data.files||[]).length;
  const mode=await choose(`Backup vom ${fdate((data.exportedAt||'').slice(0,10))||'?'}: ${data.products.length} Produkte, ${data.entries.length} Buchungen${nf?`, ${nf} Belege`:''}.`,
    [['merge','Zusammenführen','Übernimmt Neues und behält alles auf diesem Gerät. Bei gleichen Einträgen gewinnt der neuere Stand.'],['replace','Alles ersetzen','Löscht die Daten auf diesem Gerät und übernimmt das Backup 1:1.']]);
  if(!mode)return;
  if(mode==='replace'&&!await ask('Wirklich alle Daten auf diesem Gerät durch das Backup ersetzen?','Ersetzen'))return;
  toast('Backup wird geladen …');
  const cols=['products','customers','suppliers','entries','recurring'];let added=0,updated=0;
  await Store.bulk(async()=>{
    if(mode==='replace'){for(const c of cols){for(const x of [...S[c]])await Store.del(c,x.id);for(const x of (data[c]||[]))await Store.put(c,x,true)}
      S.settings={...DEF,...(data.settings||{})}}
    else{
      for(const c of cols)for(const x of (data[c]||[])){const cur=S[c].find(y=>y.id===x.id);
        if(!cur){await Store.put(c,x,true);added++}else if((x.updated||'')>(cur.updated||'')){await Store.put(c,x,true);updated++}}
      const ds=data.settings||{},st=S.settings;
      S.settings={...st,categories:[...new Set([...st.categories,...(ds.categories||[])])],expenseCats:[...new Set([...st.expenseCats,...(ds.expenseCats||[])])],
        nextInvoice:ds.invoiceYear===st.invoiceYear?Math.max(num(st.nextInvoice),num(ds.nextInvoice)):st.nextInvoice,
        owner:st.owner||ds.owner||'',company:st.company||ds.company||'',address:st.address||ds.address||'',uidNr:st.uidNr||ds.uidNr||'',iban:st.iban||ds.iban||''};
    }
  });
  for(const f of (data.files||[])){try{if(mode==='replace'||!await IDB.get(f.id))await IDB.put(f)}catch{}}
  const seen={};let dup=0;S.entries.forEach(e=>{if(!e.invoiceNo)return;if(seen[e.invoiceNo])dup++;seen[e.invoiceNo]=1});
  toast(mode==='merge'?`Zusammengeführt: ${added} neu, ${updated} aktualisiert`:'Backup geladen');
  if(dup)setTimeout(()=>toast(`Achtung: ${dup} Rechnungsnummer${dup>1?'n':''} doppelt – Rechnungen bitte nur auf einem Gerät erstellen.`),3000);
}

      openEntryForm(KIND[k].type,null,{party:r?.name||b.dataset.name,partyAddress:k==='kunde'?(r?.address||''):'',delivered:now,paid:now});break}
    case'storno':stornoEntry(id);break;
    case'pay-rest':{const e=S.entries.find(x=>x.id===id);await addPayment(id,openAmt(e),today(),openAmt(e)>0?(UI.pm||e.method):e.method);closeSheet();toast('Als bezahlt markiert');break}
    case'pay-part':openPay(id);break;
    case'save-pay':{const amt=r2(num($('#payAmt').value)),wo=$('#payWO')?.checked;if(!amt&&!wo){toast('Bitte einen Betrag eingeben.');break}
      if(amt)await addPayment(id,amt,$('#payDate').value||today(),$('#payMethod').value);
      if(wo){const e=S.entries.find(x=>x.id===id);const paid=r2(paidSum(e)),newTot=paid,disc=r2(num(e.regular||e.total)-newTot);
        const ne={...e,total:newTot,discount:disc};ne.paid=isPaid(ne);await Store.put('entries',ne).catch(()=>{});closeSheet();toast('Preis auf '+eur(newTot)+' gesenkt');break}
      toast('Zahlung erfasst');openEntry(id);break}
    case'del-pay':{const e=S.entries.find(x=>x.id===id);if(!await ask('Diese Zahlung entfernen?','Entfernen'))break;const pays=[...paysOf(e)];pays.splice(+b.dataset.i,1);const ne={...e,payments:pays};ne.paid=isPaid(ne);await Store.put('entries',ne).catch(()=>{});openEntry(id);break}
    case'remind':openReminder(id);break;
    case'rem-tone':UI.remTone=v;try{localStorage.setItem('kb_tone',v)}catch{}openReminder(id);break;
    case'rem-copy':{const txt=$('#remText').value;try{await navigator.clipboard.writeText(txt);await markReminded(id);toast('Text kopiert – Erinnerung vermerkt')}catch{const ta=$('#remText');ta.focus();ta.select();toast('Text markiert – jetzt kopieren')}break}
    case'rem-share':{const txt=$('#remText').value;if(navigator.share){try{await navigator.share({text:txt});await markReminded(id);toast('Erinnerung vermerkt')}catch(err){if(!err||err.name!=='AbortError')toast('Teilen nicht möglich – bitte kopieren.')}}
      else{try{await navigator.clipboard.writeText(txt);await markReminded(id);toast('Text kopiert – Erinnerung vermerkt')}catch{toast('Bitte den Text kopieren.')}}break}
    case'show-overdue':UI.filter='ueberfaellig';UI.screen='buchungen';render();scrollTo(0,0);break;
    case'view-att':viewAtt(id);break;
    case'kcat':UI.kcat=v;render();break;
    case'cart-add':cartAdd(id);render();break;
    case'cart-clear':if(await ask('Warenkorb leeren?','Leeren')){UI.cart=[];render()}break;
    case'checkout':openCheckout();break;
    case'cart-inc':case'cart-dec':{UI.kparty=$('#coParty')?.value||'';UI.krecv=$('#coRecv')?.value??'';UI.knote=$('#coNote')?.value||'';const c=UI.cart[+b.dataset.i];if(c)c.qty+=a==='cart-inc'?1:-1;UI.cart=UI.cart.filter(x=>x.qty>0);render();openCheckout();break}
    case'kpay':UI.kparty=$('#coParty')?.value||'';UI.krecv=$('#coRecv')?.value??'';UI.knote=$('#coNote')?.value||'';UI.kpay=v;openCheckout();break;
    case'co-save':doCheckout();break;
    case'scan':startScan(code=>handleScan(v,code));break;
    case'annual':openAnnual(v);break;
    case'fin-export':{const k=await choose(`Finanzübersicht ${v} – nur Zahlen, ohne Produkte und Kunden.`,[['pdf','PDF','Monate, Einnahmen, Ausgaben, Überschuss, Rohertrag – zum Weitergeben'],['csv','Excel / Numbers (CSV)','Dieselben Zahlen als Tabelle zum Weiterrechnen'],['view','Jahresübersicht ansehen','Ausführliche Steuer-Übersicht mit Drucken']]);
      if(k==='pdf')finPDF(v);else if(k==='csv')finCSV(v);else if(k==='view')openAnnual(v);break}
    case'save-annual':saveAnnual(v);break;
    case'new-rec':openRec();break;
    case'edit-rec':openRec(id);break;
    case'save-rec':saveRec();break;
    case'del-rec':if(await ask('Wiederkehrende Ausgabe löschen? Bereits gebuchte Ausgaben bleiben erhalten.')){await Store.del('recurring',RC.id);closeSheet();toast('Gelöscht')}break;
    case'invoice':invoice(id);break;
    case'save-invoice':saveInvoice(id);break;
    case'label':openLabel({entryId:id,name:b.dataset.name});break;
    case'lb-fmt':lbFields();LB.fmt=v;UI.lblFmt=v;try{localStorage.setItem('kb_lblfmt',v)}catch{}renderLabelForm();break;
    case'lb-print':printLabel();break;
    case'lb-pdf':labelPDF();break;
    case'lb-ship':saveShipment();break;
    case'print-invoice':printNow('print-inv');break;
    case'new-product':openProduct();break;
    case'edit-product':closeSheet();openProduct(id);break;
    case'save-product':saveProduct();break;
    case'del-product':{const used=S.entries.some(e=>(e.items||[]).some(i=>i.pid===P.id));
      if(await ask(used?'Produkt löschen? Bestehende Buchungen behalten den Produktnamen.':'Produkt löschen?')){await Store.del('products',P.id);closeSheet();toast('Produkt gelöscht')}break}
    case'stock':openStock(id);break;
    case'prod':openProductStats(id);break;
    case'reorder':{const p=prodById(id);const ps=productStats(p);closeSheet();openEntryForm('einkauf',null,{items:[{pid:p.id,qty:ps.suggest,price:p.ek}],delivered:false,paid:false,updateEk:true});break}
    case'save-stock':{const p=prodById(id);const cur=stockMap()[id];const n=Math.round(num($('#sCount').value));await Store.put('products',{...p,stockStart:num(p.stockStart)+(n-cur)}).catch(()=>{});closeSheet();toast('Bestand korrigiert');break}
    case'edit-settings':openSettings();break;
    case'save-settings':saveSettings();break;
    case'add-cat':{const inp=$('#'+b.dataset.src);const val=inp.value.trim();const k=b.dataset.k;if(!val)break;if(S.settings[k].includes(val)){toast('Gibt es schon.');break}
      await Store.setSettings({...S.settings,[k]:[...S.settings[k],val]});break}
    case'del-cat':{const k=b.dataset.k;const arr=[...S.settings[k]];if(arr.length<=1){toast('Mindestens eine Kategorie muss bleiben.');break}arr.splice(+b.dataset.i,1);await Store.setSettings({...S.settings,[k]:arr});break}
    case'export-csv':exportCSV();break;
    case'export-json':exportJSON();break;
    case'load-sample':loadSample();break;
    case'clear-sample':clearSample();break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.cartPrice!==undefined){const c=UI.cart[+t.dataset.cartPrice];if(c)c.price=num(t.value);coRefresh();return}
  if(t.id==='noteEdit'){const b=$('#noteBtn');if(b)b.hidden=false;return}
  if(t.id==='coGiven'||t.id==='coRecv'){coRefresh();return}
  if(t.id&&t.id.startsWith('lb_')&&LB){refreshLabel();return}
  if(t.id==='q'||t.id==='cq'||t.id==='pq'||t.id==='kq'){UI[t.id]=t.value;const pos=t.selectionStart;render();const n=$('#'+t.id);n.focus();n.setSelectionRange(pos,pos);return}
  if(!F)return;
  if(t.dataset.row!==undefined&&t.dataset.k!=='pid'){F.items[+t.dataset.row][t.dataset.k]=t.value;updateSummary();return}
  if(t.dataset.f&&t.type!=='checkbox'&&t.tagName!=='SELECT'){F[t.dataset.f]=t.value;updateSummary()}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.attEntry&&t.files.length){const id=t.dataset.attEntry;const metas=await storeFiles([...t.files],id);t.value='';
    if(metas.length){const e=S.entries.find(x=>x.id===id);await Store.put('entries',{...e,att:[...(e.att||[]),...metas]}).catch(()=>{});toast(metas.length===1?'Beleg gespeichert':metas.length+' Belege gespeichert');openEntry(id)}return}
  if(t.dataset.attForm&&F&&t.files.length){const metas=await storeFiles([...t.files],F.id||F.newId);t.value='';F.att=[...(F.att||[]),...metas];renderEntryForm();return}
  if(t.id==='lb_toName'&&LB){const c=custByName(t.value);if(c&&c.name!==LB.custName){LB.custName=c.name;const a=splitAddr(c.address);lbFields();Object.assign(LB,{custName:c.name,toName:c.name,toExtra:a.extra,toStreet:a.street,toZip:a.zip,toCity:a.city,toCountry:a.country||'Österreich',toPhone:c.phone||''});setTimeout(renderLabelForm,0)}else refreshLabel();return}
  if(t.id==='lb_xFrom'){try{localStorage.setItem('kb_xfrom',t.checked?'1':'0')}catch{}}
  if(t.id&&t.id.startsWith('lb_')&&LB){refreshLabel();return}
  if(t.id==='psort'){UI.psort=t.value;try{localStorage.setItem('kb_psort',t.value)}catch{}render();return}
  if(t.id==='importFile'&&t.files[0]){importJSON(t.files[0]);t.value='';return}
  if(!F)return;
  if(t.dataset.k==='pid'){const it=F.items[+t.dataset.row];it.pid=t.value;delete it.ek;delete it.name;delete it.tax;delete it.unit;const p=prodById(t.value);if(p)it.price=F.type==='verkauf'?p.vk:p.ek;renderEntryForm();return}
  if(t.dataset.f==='paid'){F.payStatus=t.value;return}
  if(t.dataset.f==='delivered'){F.delivered=t.value==='1';if(!F.id)F.payStatus=F.delivered?'1':'0';renderEntryForm();return}
  if(t.dataset.f==='party'&&F.type==='verkauf'){const c=custByName(t.value);if(c&&c.address&&!F.partyAddress.trim()){F.partyAddress=c.address;const ta=document.querySelector('[data-f="partyAddress"]');if(ta)ta.value=c.address}return}
  if(t.type==='checkbox'&&t.dataset.f){F[t.dataset.f]=t.checked;return}
  if(t.tagName==='SELECT'&&t.dataset.f){F[t.dataset.f]=t.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetRoot').innerHTML)closeSheet()});

render();Store.connect();
const APP_VER='28';
async function checkUpdate(){try{if(!navigator.onLine)return;const r=await fetch('index.html?u='+Date.now(),{cache:'no-store'});if(!r.ok)return;
  const m=(await r.text()).match(/const APP_VER='([^']+)'/);if(!m||m[1]===APP_VER||document.getElementById('updBar'))return;
  const w=document.createElement('button');w.id='updBar';w.innerHTML='<b>Neue Version verfügbar</b><span>Tippen zum Aktualisieren – deine Daten bleiben erhalten</span>';
  w.onclick=()=>location.reload();document.body.appendChild(w)}catch{}}
setTimeout(checkUpdate,2500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
