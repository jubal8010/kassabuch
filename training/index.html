<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Training</title>
<style>
:root{
  --bg:#0e0f12;--card:#17191e;--card2:#1f2229;--line:#2a2e37;--text:#eef0f4;--muted:#8b919e;
  --acc:#c6f432;--acc-ink:#11140a;--red:#ff5d5d;--blue:#5db4ff;--gold:#ffc94a;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-t);padding-bottom:calc(76px + var(--safe-b));min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header.top{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid transparent}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
header.top .sub{color:var(--muted);font-size:13px}
main{padding:8px 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--card2);font-weight:600;min-height:46px}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.red{background:rgba(255,93,93,.14);color:var(--red)}
.btn.ghost{background:transparent;color:var(--muted);padding:8px 10px;min-height:0}
.btn.block{width:100%}
.btn:active{transform:scale(.98);opacity:.85}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--muted)}
.pill.pr{background:rgba(255,201,74,.15);color:var(--gold);font-weight:700}
input.f,select.f,textarea.f{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;letter-spacing:-.01em}
.stat b.small{font-size:16px;margin-top:3px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,20,24,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
/* workout */
.ex{background:var(--card);border-radius:var(--r);padding:12px 12px 8px;margin-bottom:12px}
.ex h3{margin:0;font-size:17px}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets td.n{width:30px;color:var(--muted);font-weight:700}
.sets td.prev{color:var(--muted);font-size:13px;width:72px}
.sets input{width:100%;max-width:74px;text-align:center;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:9px 2px;font-weight:600;outline:none;-moz-appearance:textfield}
.sets input:focus{border-color:var(--acc)}
.sets input::-webkit-outer-spin-button,.sets input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:38px;height:38px;border-radius:10px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.chk.on{background:var(--acc);color:var(--acc-ink)}
tr.done input{background:rgba(198,244,50,.10);color:var(--acc)}
.settype{font-size:11px;font-weight:800;border-radius:6px;padding:2px 0;display:inline-block;width:24px}
.settype.w{color:var(--gold)}
.settype.d{color:var(--blue)}
.draghandle{touch-action:none;cursor:grab;font-size:24px;line-height:1;color:var(--muted);padding:14px 12px 14px 4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;align-self:stretch;display:flex;align-items:center}
.drow{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);background:var(--card)}
.drow:last-child{border-bottom:0}
.drow-main{flex:1;padding:12px 0;cursor:pointer;min-width:0}
.dragitem.dragging{position:relative;z-index:5;background:var(--card2);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.55);border-bottom-color:transparent}
.switch{position:relative;display:inline-block;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span:before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span:before{transform:translateX(20px)}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:8px}
/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));z-index:40;background:var(--acc);color:var(--acc-ink);border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:616px;margin:0 auto}
#timer.show{display:flex}
#timer b{font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:rgba(0,0,0,.12);border-radius:10px;padding:8px 11px;font-weight:700;color:var(--acc-ink)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 12px;font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--card2);font-size:14px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);font-weight:600}
canvas{width:100%;display:block}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(calc(-100% - 60px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.hist-ex{font-size:14px;color:var(--muted);margin-top:4px}
.sect{margin:18px 2px 8px}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
</style>
</head>
<body>
<header class="top"><div><h1 id="title">Training</h1><div class="sub" id="subtitle"></div></div><div id="hdrAct"></div></header>
<main id="view"></main>

<div id="timer"><div><div class="small" style="font-weight:600;opacity:.75">Pause</div><b id="timerTxt">0:00</b></div><div class="row"><button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="x">Skip</button></div></div>

<nav class="tabs" id="tabs">
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Verlauf</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Statistik</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mehr</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const APP_VERSION='2.6';
/* ================= Daten ================= */
const KEY='training.v1';
const MUSCLES=['Brust','Obere Brust','Rücken','Latissimus','Unterer Rücken','Schultern','Hintere Schulter','Bizeps','Trizeps','Quadrizeps','Beinbeuger','Adduktoren','Po','Waden','Bauch','Unterarme','Ganzkörper','Cardio'];
/* Dein Plan: [Name, Muskelgruppe, Sätze, Wdh min, Wdh max, kg] */
const PLAN=[
 {name:'Brust & Rücken',emoji:'🏋️',items:[
  ['Flat Smith Machine','Brust',2,8,10,100],['Latziehen','Latissimus',2,8,10,110],['Incline Smith Machine','Obere Brust',2,8,10,92.5],
  ['Rudern Kabelturm','Rücken',2,8,10,105],['Flys Maschine','Brust',2,12,15,75],['Enges Rudern','Rücken',2,8,10,85],
  ['Flys Kabelturm','Brust',1,'','',45,{amrap:true,drops:[20]}],['Latzug einarmig','Latissimus',2,8,10,85]]},
 {name:'Arme & Schultern',emoji:'💪',items:[
  ['Seitheben Maschine','Schultern',3,12,15,70],['Reverse Flys Maschine','Hintere Schulter',3,15,20,60],['Hammer Curls','Bizeps',2,8,10,20],
  ['Pushdowns','Trizeps',3,10,12,105],['Preacher Curls','Bizeps',2,10,12,36.25],['Trizeps Überkopf','Trizeps',3,10,12,80],
  ['Seitheben Kurzhantel','Schultern',3,12,15,14],['Reverse Flys Kurzhantel','Hintere Schulter',3,15,20,10],['Bizeps Curls Kabel','Bizeps',2,8,10,32.5]]},
 {name:'Beine & Core',emoji:'🧱',items:[
  ['Adduktoren Maschine','Adduktoren',2,8,10,90],['Leg Curls','Beinbeuger',2,8,10,85],['Hack Squat','Quadrizeps',2,8,10,75],
  ['Beinstrecker','Quadrizeps',3,8,10,90],['Cable Crunches','Bauch',4,12,15,90],['Rückenstrecker','Unterer Rücken',2,10,12,55]]}
];
const DEFAULT_EX=[
 ['Bankdrücken (Langhantel)','Brust'],['Schrägbankdrücken (Kurzhantel)','Obere Brust'],['Bankdrücken (Kurzhantel)','Brust'],['Brustpresse (Maschine)','Brust'],
 ['Klimmzüge','Latissimus'],['Langhantelrudern','Rücken'],['Kurzhantelrudern einarmig','Rücken'],['T-Bar Rudern','Rücken'],['Kreuzheben','Unterer Rücken'],['Face Pulls','Hintere Schulter'],['Shrugs','Rücken'],
 ['Schulterdrücken (Kurzhantel)','Schultern'],['Military Press','Schultern'],['Seitheben (Kabel)','Schultern'],
 ['Langhantelcurls','Bizeps'],['Kurzhantelcurls','Bizeps'],['French Press','Trizeps'],['Enges Bankdrücken','Trizeps'],['Dips','Trizeps'],
 ['Kniebeugen','Quadrizeps'],['Beinpresse','Quadrizeps'],['Beinbeuger sitzend','Beinbeuger'],['Rumänisches Kreuzheben','Beinbeuger'],['Ausfallschritte','Quadrizeps'],['Bulgarian Split Squats','Quadrizeps'],
 ['Hip Thrust','Po'],['Abduktoren Maschine','Po'],
 ['Wadenheben stehend','Waden'],['Wadenheben sitzend','Waden'],
 ['Beinheben hängend','Bauch'],['Plank','Bauch'],
 ['Laufband','Cardio'],['Crosstrainer','Cardio'],['Stairmaster','Cardio']
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function defaults(){
  const exercises=[];
  const add=(name,muscle)=>{let e=exercises.find(x=>x.name===name);if(!e){e={id:uid(),name,muscle};exercises.push(e)}return e.id};
  const templates=PLAN.map(p=>({id:uid(),name:p.name,emoji:p.emoji,items:p.items.map(([n,m,sets,rMin,rMax,kg,x])=>Object.assign({exId:add(n,m),sets,rMin,rMax,kg},x||{}))}));
  DEFAULT_EX.forEach(([n,m])=>add(n,m));
  const bench=exercises.find(e=>e.name==='Bankdrücken (Langhantel)').id;
  return {version:2,exercises,workouts:[],templates,body:[],active:null,
    prs:[{id:uid(),exId:bench,kg:130,reps:1,t:new Date(2026,6,6,12).getTime(),note:'Bench Press PR'}],
    cycle:{days:[templates[0].id,templates[1].id,templates[2].id,'rest'],anchor:'2026-10-19',anchorIdx:0},cycleFix:1,
    settings:{rest:120,unit:'kg'}};
}
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.exercises)){S=defaults();save()}
  const d=defaults();
  for(const k of ['workouts','templates','body','exercises'])if(!Array.isArray(S[k]))S[k]=d[k];
  if(!Array.isArray(S.prs))S.prs=[];
  if(!S.cycle)S.cycle={days:S.templates.slice(0,3).map(t=>t.id).concat('rest'),anchor:isoDay(new Date()),anchorIdx:0};
  // Fixpunkt: 19.10.2026 = Brust & Rücken (Tag 1)
  if(!S.flyFix){S.flyFix=1;const fe=S.exercises.find(e=>e.name==='Flys Kabelturm');if(fe)S.templates.forEach(t=>t.items.forEach(i=>{if(i.exId===fe.id)Object.assign(i,{sets:1,rMin:'',rMax:'',kg:45,amrap:true,drops:[20]})}));save()}
  if(!S.ww||typeof S.ww!=='object'){S.ww={};S.wwLog=[];const t0=Date.now();
    S.templates.forEach(t=>t.items.forEach(i=>{if(i.kg!==''&&i.kg!=null&&S.ww[i.exId]==null){S.ww[i.exId]=num(i.kg);S.wwLog.push({exId:i.exId,kg:num(i.kg),t:t0})}}));save()}
  if(!Array.isArray(S.wwLog))S.wwLog=[];
  if(S.cycleFix!==1){S.cycle.anchor='2026-10-19';S.cycle.anchorIdx=0;S.cycleFix=1;save()}
  S.settings=Object.assign({},d.settings,S.settings||{});
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern fehlgeschlagen!')}
}
const exById=id=>S.exercises.find(e=>e.id===id)||{name:'(gelöschte Übung)',muscle:''};

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmt=(n,d=1)=>{n=Math.round(n*10**d)/10**d;return n.toLocaleString('de-AT',{maximumFractionDigits:d})};
const e1rm=(w,r)=>r>0&&w>0?(r===1?w:w*(1+r/30)):0;
const dFmt=(t,o={weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'})=>new Date(t).toLocaleDateString('de-AT',o);
const tFmt=t=>new Date(t).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
function dur(ms){const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const ICON={
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>'
};

/* Letzte Sätze einer Übung (aus abgeschlossenen Trainings) */
function lastSets(exId,beforeTs=Infinity){
  for(let i=S.workouts.length-1;i>=0;i--){
    const w=S.workouts[i];if(w.start>=beforeTs)continue;
    const ex=w.exercises.find(e=>e.exId===exId);
    if(ex&&ex.sets.some(s=>s.done))return ex.sets.filter(s=>s.done);
  }
  return null;
}
function bestE1rm(exId,beforeTs=Infinity){
  let b=0;for(const p of S.prs||[])if(p.exId===exId&&p.t<beforeTs)b=Math.max(b,e1rm(p.kg,p.reps));
  for(const w of S.workouts){if(w.start>=beforeTs)continue;for(const ex of w.exercises)if(ex.exId===exId)for(const s of ex.sets)if(s.done&&isW(s))b=Math.max(b,e1rm(num(s.kg),num(s.reps)))}
  return b;
}
const isW=s=>!s.type||s.type==='n';
/* Arbeitsgewicht: fixer Zielwert pro Übung, unabhängig davon, was in einem Satz tatsächlich geschafft wurde */
const getWW=exId=>S.ww&&S.ww[exId]!=null?S.ww[exId]:null;
function setWW(exId,kg){
  kg=Math.round(num(kg)*100)/100;if(!(kg>0)||kg===getWW(exId))return false;
  S.ww[exId]=kg;S.wwLog.push({exId,kg,t:Date.now()});
  S.templates.forEach(t=>t.items.forEach(i=>{if(i.exId===exId)i.kg=kg}));return true;
}
function isoDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayNum(iso){const [y,m,d]=iso.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
function cycleIdx(date=new Date()){const C=S.cycle,n=C.days.length;if(!n)return 0;return(((C.anchorIdx+dayNum(isoDay(date))-dayNum(C.anchor))%n)+n)%n}
function cycleLabel(id){if(id==='rest')return {emoji:'😴',name:'Rest Day'};const t=S.templates.find(x=>x.id===id);return t?{emoji:t.emoji||'🏋️',name:t.name,t}:{emoji:'❔',name:'(gelöschte Vorlage)'}}
function setToday(idx){S.cycle.anchor=isoDay(new Date());S.cycle.anchorIdx=idx;save()}
function workoutStats(w){
  let vol=0,sets=0;
  for(const ex of w.exercises)for(const s of ex.sets)if(s.done){sets++;if(s.type!=='w')vol+=num(s.kg)*num(s.reps)}
  return {vol,sets};
}

/* ================= Navigation ================= */
let tab='workout';
const TITLES={workout:'Training',history:'Verlauf',progress:'Statistik',more:'Mehr'};
function go(t){if(t==='progress'&&tab==='progress')progressEx=null;PAGES=[];tab=t;try{sessionStorage.setItem('tab',t)}catch(e){}render();window.scrollTo(0,0)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)go(b.dataset.tab)});
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#title').style.fontSize='';
  $('#title').textContent=TITLES[tab];$('#subtitle').textContent='';$('#hdrAct').innerHTML='';
  ({workout:renderWorkout,history:renderHistory,progress:renderProgress,more:renderMore})[tab]();
}

/* ================= Training ================= */
let tick=null;
function renderWorkout(){
  clearInterval(tick);
  const A=S.active,v=$('#view');
  if(!A){
    const n=S.cycle.days.length,ci=cycleIdx(),today=cycleLabel(S.cycle.days[ci]);

function newExEntry(exId,n=3,target=null){
  const prev=lastSets(exId);const work=prev&&prev.filter(isW);const prevDrops=prev?prev.filter(s=>s.type==='d'):[];
  const tg=target&&(target.rMax||target.kg!==''||target.amrap)?{rMin:target.rMin,rMax:target.rMax,kg:target.kg,amrap:!!target.amrap,drops:target.drops||[]}:null;
  // Progression: alle Arbeitssätze am oberen Ende der Spanne → Hinweis
  const up=!!(tg&&tg.rMax&&work&&work.length&&work.every(s=>num(s.reps)>=tg.rMax));
  const sets=[];for(let i=0;i<n;i++){
    const p=work&&work.length?work[Math.min(i,work.length-1)]:null;
    const ww=getWW(exId);
    const kg=ww!=null?ww:p?p.kg:tg&&tg.kg!==''?tg.kg:'';
    const reps=p?p.reps:tg?(tg.rMax||''):'';
    const ph=kg!==''||reps!==''?{kg,reps}:null;
    sets.push({kg:'',reps:'',done:false,type:'n',ph});
  }
  (tg?tg.drops:[]).forEach((dk,i)=>{const p=prevDrops[i];sets.push({kg:'',reps:'',done:false,type:'d',ph:p?{kg:p.kg,reps:p.reps}:{kg:dk,reps:''}})});
  return {exId,sets,note:'',target:tg,up};
}
const targetTxt=t=>t?[t.amrap?'max. Wdh':t.rMax?(t.rMin&&t.rMin!==t.rMax?`${t.rMin}–${t.rMax} Wdh`:`${t.rMax} Wdh`):'',t.kg!==''&&t.kg!=null?`${fmt(num(t.kg),2)} kg`:'',...(t.drops||[]).map(d=>`Drop → ${fmt(num(d),2)} kg`)].filter(Boolean).join(' · '):'';
function deltaTag(s,p){
  const dk=num(s.kg)-num(p.kg),dr=num(s.reps)-num(p.reps);
  let t,c;if(dk>0){t=`+${fmt(dk,2)} kg`;c='var(--acc)'}else if(dk<0){t=`${fmt(dk,2)} kg`;c='var(--red)'}
  else if(dr>0){t=`+${dr} Wdh`;c='var(--acc)'}else if(dr<0){t=`${dr} Wdh`;c='var(--red)'}else{t='=';c='var(--muted)'}
  return `<div style="font-size:11px;font-weight:700;color:${c}">${t}</div>`;
}

function bindWorkout(v){

/* Drag & Drop über den Griff ⠿ – Touch (iPhone/Android) und Maus */
function sortable(list,onDrop){
  if(!list)return;
  list.querySelectorAll('[data-drag]').forEach(h=>{
    let el,from,startPageY,lastY,raf,active=false;
    const frame=()=>{
      if(!active)return;
      if(lastY<90)window.scrollBy(0,-7);else if(lastY>innerHeight-150)window.scrollBy(0,7);
      let off=lastY+scrollY-startPageY;
      const prev=el.previousElementSibling,next=el.nextElementSibling;
      if(prev){const r=prev.getBoundingClientRect();if(lastY<r.top+r.height/2){list.insertBefore(el,prev);startPageY-=r.height;off+=r.height;vib(8)}}
      if(next){const r=next.getBoundingClientRect();if(lastY>r.top+r.height/2){list.insertBefore(next,el);startPageY+=r.height;off-=r.height;vib(8)}}
      el.style.transform=`translateY(${off}px)`;raf=requestAnimationFrame(frame);
    };
    const start=y=>{el=h.closest('.dragitem');from=[...list.children].indexOf(el);startPageY=y+scrollY;lastY=y;active=true;el.classList.add('dragging');vib(15);raf=requestAnimationFrame(frame)};
    const end=()=>{if(!active)return;active=false;cancelAnimationFrame(raf);el.classList.remove('dragging');el.style.transform='';
      document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',end);document.removeEventListener('touchcancel',end);
      window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',end);
      const to=[...list.children].indexOf(el);if(to!==from)onDrop(from,to)};
    const tm=e=>{e.preventDefault();lastY=e.touches[0].clientY};
    const mm=e=>{lastY=e.clientY};
    h.addEventListener('touchstart',e=>{e.preventDefault();start(e.touches[0].clientY);
      document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',end);document.addEventListener('touchcancel',end)},{passive:false});
    h.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientY);window.addEventListener('mousemove',mm);window.addEventListener('mouseup',end)});
  });
}

/* ================= Übungen ================= */
let progressEx=null,progressMetric='ww';
function openExercise(id){progressEx=id;tab='progress';try{sessionStorage.setItem('tab',tab)}catch(e){}render();window.scrollTo(0,0)}
function exSessions(exId){
  return S.workouts.map(w=>{const sets=w.exercises.filter(e=>e.exId===exId).flatMap(e=>e.sets);return {t:w.start,id:w.id,sets,work:sets.filter(isW)}}).filter(x=>x.sets.length);
}
const DAY=864e5;
const topSet=x=>x.work.reduce((m,s)=>num(s.kg)>num(m.kg)||(num(s.kg)===num(m.kg)&&num(s.reps)>num(m.reps))?s:m,x.work[0]);
// Veränderung des schwersten Satzes: zuerst Gewicht, bei gleichem Gewicht Wiederholungen
function change(a,b){if(!a||!b)return null;const dk=num(b.kg)-num(a.kg);return dk?{kg:dk}:{reps:num(b.reps)-num(a.reps)}}
function changeTxt(c){if(!c)return '–';if(c.kg!=null)return `<span style="color:${c.kg>0?'var(--acc)':'var(--red)'}">${c.kg>0?'+':''}${fmt(c.kg,2)} kg</span>`;
  return c.reps?`<span style="color:${c.reps>0?'var(--acc)':'var(--red)'}">${c.reps>0?'+':''}${c.reps} Wdh</span>`:'<span class="muted">gleich</span>'}
function sinceChange(exId,days){
  const ss=exSessions(exId).filter(x=>x.work.length);if(ss.length<2)return null;
  const last=ss[ss.length-1];const from=days?Date.now()-days*DAY:-Infinity;
  const base=[...ss].reverse().find(x=>x!==last&&x.t<=from)||ss.find(x=>x.t>=from&&x!==last);
  return base?change(topSet(base),topSet(last)):null;
}
function overviewHtml(){
  const now=new Date(),monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)).getTime();
  const month=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const wk=S.workouts.filter(w=>w.start>=monday).length,mo=S.workouts.filter(w=>w.start>=month).length;
  const durs=S.workouts.slice(-10).map(w=>(w.end||w.start)-w.start).filter(d=>d>5*6e4&&d<5*36e5);
  const avg=durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:0;
  // Arbeitssätze pro Muskelgruppe, letzte 7 Tage
  const mus={};S.workouts.filter(w=>w.start>Date.now()-7*DAY).forEach(w=>w.exercises.forEach(e=>{const m=exById(e.exId).muscle||'Sonstige';mus[m]=(mus[m]||0)+e.sets.filter(isW).length}));
  const mk=Object.entries(mus).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...mk.map(x=>x[1]));
  // Fortschritt letzte 4 Wochen
  const used=[...new Set(S.workouts.flatMap(w=>w.exercises.map(e=>e.exId)))].filter(id=>S.exercises.some(e=>e.id===id));
  const prog=used.map(id=>({id,c:sinceChange(id,28)})).filter(x=>x.c&&(x.c.kg||x.c.reps));
  const score=c=>c.kg!=null?c.kg*10:c.reps;prog.sort((a,b)=>score(b.c)-score(a.c));
  // Wochen-Balken (8 Wochen)
  const weeks=Array.from({length:8},(_,i)=>{const st=monday-(7-i)*7*DAY;return S.workouts.filter(w=>w.start>=st&&w.start<st+7*DAY).length});const wm=Math.max(1,...weeks);
  return `
  <div class="grid3" style="margin-bottom:12px">
    <div class="stat"><span class="tiny">Diese Woche</span><b>${wk}</b></div>
    <div class="stat"><span class="tiny">Dieser Monat</span><b>${mo}</b></div>
    <div class="stat"><span class="tiny">Ø Dauer</span><b>${avg?Math.round(avg/6e4)+' min':'–'}</b></div>
  </div>
  <div class="card"><div class="tiny" style="margin-bottom:8px">Trainings pro Woche</div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:64px">${weeks.map((n,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:10px;color:var(--muted)">${n||''}</span><div style="width:100%;height:${n/wm*42+3}px;border-radius:4px;background:${i===7?'var(--acc)':'var(--card2)'}"></div></div>`).join('')}</div>
    <div class="row between muted" style="font-size:10px;margin-top:4px"><span>vor 7 Wo.</span><span>diese Woche</span></div></div>
  <div class="card"><div class="tiny" style="margin-bottom:8px">Arbeitssätze pro Muskel · letzte 7 Tage</div>
    ${mk.length?mk.map(([m,n])=>`<div class="row" style="gap:8px;margin:6px 0"><span class="small" style="width:116px;flex:none">${esc(m)}</span><div style="flex:1;height:10px;border-radius:5px;background:var(--card2)"><div style="height:100%;width:${n/mx*100}%;border-radius:5px;background:var(--acc)"></div></div><b class="small" style="width:22px;text-align:right">${n}</b></div>`).join(''):'<span class="muted small">Noch keine Trainings in den letzten 7 Tagen.</span>'}</div>
  <div class="card"><div class="tiny" style="margin-bottom:4px">Fortschritt · letzte 4 Wochen</div><div class="muted small" style="margin-bottom:4px">Schwerster Satz: erst Gewicht, bei gleichem Gewicht Wiederholungen</div>
    ${prog.length?(()=>{const li=x=>`<div class="list-item" data-ex="${x.id}" style="cursor:pointer;padding:9px 0"><span class="small">${esc(exById(x.id).name)}</span><b class="small">${changeTxt(x.c)}</b></div>`;
      return prog.slice(0,6).map(li).join('')+(prog.length>6?`<details><summary class="muted small" style="padding:10px 0;cursor:pointer">Alle ${prog.length} anzeigen</summary>${prog.slice(6).map(li).join('')}</details>`:'')})():'<span class="muted small">Ab dem 2. Training pro Übung siehst du hier deinen Fortschritt.</span>'}</div>`;
}
function renderProgress(){
  if(progressEx&&S.exercises.some(e=>e.id===progressEx))return renderExercise();
  progressEx=null;
  const v=$('#view');
  const row=id=>{const ss=exSessions(id),l=ss[ss.length-1];
    return `<div class="list-item" data-ex="${id}" style="cursor:pointer;align-items:flex-start"><div><div>${esc(exById(id).name)}</div>${l?`<div class="muted small">${dFmt(l.t,{day:'2-digit',month:'2-digit'})}</div>`:''}</div>
      <span class="small" style="text-align:right">${l?l.sets.map(x=>setTxt(x)).join(' · '):'<span class="muted">noch nichts</span>'}</span></div>`};
  const inPlan=new Set();
  let html=overviewHtml()+`<div class="sect tiny" style="margin-top:22px">Übungen</div>`+S.templates.map(t=>{t.items.forEach(i=>inPlan.add(i.exId));return `<div class="sect tiny">${t.emoji?t.emoji+' ':''}${esc(t.name)}</div><div class="card">${t.items.filter(i=>S.exercises.some(e=>e.id===i.exId)).map(i=>row(i.exId)).join('')}</div>`}).join('');
  const other=[...new Set(S.workouts.flatMap(w=>w.exercises.map(e=>e.exId)))].filter(id=>!inPlan.has(id)&&S.exercises.some(e=>e.id===id));
  if(other.length)html+=`<div class="sect tiny">Weitere</div><div class="card">${other.map(row).join('')}</div>`;
  v.innerHTML=html;
  v.querySelectorAll('[data-ex]').forEach(r=>r.onclick=()=>openExercise(r.dataset.ex));
}
function renderExercise(){
  const v=$('#view'),ex=exById(progressEx);
  $('#title').textContent=ex.name;$('#title').style.fontSize=ex.name.length>16?'21px':'';$('#subtitle').textContent=ex.muscle;
  $('#hdrAct').innerHTML=`<button class="btn ghost" id="back">‹ Zurück</button>`;
  $('#back').onclick=()=>{progressEx=null;render()};
  const ss=exSessions(progressEx).filter(x=>x.work.length);
  const pr=(S.prs||[]).filter(p=>p.exId===progressEx);
  const wl=(S.wwLog||[]).filter(x=>x.exId===progressEx).sort((a,b)=>a.t-b.t);
  if(!ss.length&&!pr.length&&!wl.length){v.innerHTML=`<div class="empty">${ICON.dumb}<div>Für diese Übung ist noch nichts gespeichert.</div></div>`;return}
  const M=ss.length?progressMetric:'ww';
  // Kennzahl pro Training
  const maxKg=x=>x.work.reduce((m,s)=>num(s.kg)>num(m.kg)||(num(s.kg)===num(m.kg)&&num(s.reps)>num(m.reps))?s:m,x.work[0]);
  const bestSet=x=>x.work.reduce((m,s)=>num(s.kg)*num(s.reps)>num(m.kg)*num(m.reps)?s:m,x.work[0]);
  let top='',series=[],unit=' kg',hl;
  if(M==='ww'){
    const cur=getWW(progressEx);const since=wl.length?wl[wl.length-1].t:null;
    top=`<div class="tiny">Aktuelles Arbeitsgewicht</div><b class="big" style="display:block;margin-top:4px">${cur!=null?fmt(cur,2)+' kg':'–'}</b><div class="muted small">${since?'seit '+dFmt(since):'Im Training oben bei der Übung eintragen'}</div>`;
    const pts=wl.map(x=>({t:x.t,v:x.kg}));if(pts.length&&pts[pts.length-1].t<Date.now()-DAY)pts.push({t:Date.now(),v:pts[pts.length-1].v});
    series=[{pts}];hl=null;
  }else if(M==='kg'){
    const all=ss.map(x=>({x,s:maxKg(x)}));const b=all.reduce((m,a)=>num(a.s.kg)>num(m.s.kg)?a:m,all[0]||{s:{kg:0}});
    top=`<div class="tiny">Schwerster Satz</div><b class="big" style="display:block;margin-top:4px">${b.x?fmt(num(b.s.kg),2)+' kg':'–'}</b><div class="muted small">${b.x?`× ${b.s.reps} Wdh · ${dFmt(b.x.t)}`:''}</div>`
      +pr.map(p=>`<div class="small" style="margin-top:6px;color:var(--gold)">🏆 Eingetragen: ${fmt(p.kg,2)} kg × ${p.reps} · ${dFmt(p.t,{day:'2-digit',month:'2-digit',year:'2-digit'})}</div>`).join('');
    series=[{pts:all.map(a=>({t:a.x.t,v:num(a.s.kg)}))}];hl=x=>maxKg(x);
  }else if(M==='load'){
    const all=ss.map(x=>({x,s:bestSet(x)}));const b=all.reduce((m,a)=>num(a.s.kg)*num(a.s.reps)>num(m.s.kg)*num(m.s.reps)?a:m,all[0]);
    top=`<div class="tiny">Meiste Last in einem Satz (kg × Wdh)</div><b class="big" style="display:block;margin-top:4px">${fmt(num(b.s.kg)*num(b.s.reps),0)} kg</b><div class="muted small">${fmt(num(b.s.kg),2)} kg × ${b.s.reps} · ${dFmt(b.x.t)}</div>`;
    series=[{pts:all.map(a=>({t:a.x.t,v:num(a.s.kg)*num(a.s.reps)}))}];hl=x=>bestSet(x);
  }else{
    const n=Math.max(...ss.map(x=>x.work.length));const l=ss[ss.length-1];
    top=`<div class="tiny">Wiederholungen letztes Training</div><b class="big" style="display:block;margin-top:4px">${l.work.map(s=>s.reps).join(' / ')}</b><div class="muted small">${l.work.map(s=>fmt(num(s.kg),2)+' kg').join(' / ')} · ${dFmt(l.t)}</div>`;
    const cols=['var(--acc)','var(--blue)','var(--gold)','var(--red)','#c58bff'];
    for(let i=0;i<Math.min(n,5);i++)series.push({label:`Satz ${i+1}`,color:cols[i],pts:ss.filter(x=>x.work[i]).map(x=>({t:x.t,v:num(x.work[i].reps)}))});
    unit='';hl=null;
  }
  v.innerHTML=`
    <div class="chips" style="margin-bottom:10px">${[['ww','Arbeitsgewicht'],['kg','Max. Gewicht'],['load','Bester Satz'],['reps','Wiederholungen']].filter(([k])=>ss.length||k==='ww').map(([k,l])=>`<button class="chip ${M===k?'on':''}" data-pm="${k}">${l}</button>`).join('')}</div>
    <div class="card">${top}</div>
    <div class="card"><canvas id="pchart" height="200"></canvas>
      ${series.length>1?`<div class="row small" style="gap:12px;margin-top:8px;flex-wrap:wrap">${series.map(x=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${x.color};margin-right:4px"></span>${x.label}</span>`).join('')}</div>`:''}</div>
    <div class="grid3" style="margin-bottom:12px">
      <div class="stat"><span class="tiny">Trainings</span><b>${ss.length}</b></div>
      <div class="stat"><span class="tiny">Seit Start</span><b class="small">${changeTxt(sinceChange(progressEx,0))}</b></div>
      <div class="stat"><span class="tiny">4 Wochen</span><b class="small">${changeTxt(sinceChange(progressEx,28))}</b></div>
    </div>
    ${(()=>{const m={};ss.forEach(x=>x.work.forEach(s=>{const k=num(s.kg);if(!m[k]||num(s.reps)>m[k].r)m[k]={r:num(s.reps),t:x.t}}));const ks=Object.keys(m).map(Number).sort((a,b)=>b-a).slice(0,8);
      return ks.length?`<div class="sect tiny">Meiste Wdh pro Gewicht</div><div class="card">${ks.map(k=>`<div class="list-item" style="padding:9px 0"><span><b>${fmt(k,2)} kg</b></span><span class="small"><b>${m[k].r} Wdh</b> <span class="muted">· ${dFmt(m[k].t,{day:'2-digit',month:'2-digit',year:'2-digit'})}</span></span></div>`).join('')}</div>`:''})()}
    ${M==='ww'&&wl.length?`<div class="sect tiny">Änderungen Arbeitsgewicht</div><div class="card">${[...wl].reverse().map((x,i,a)=>{const prev=a[i+1];const d=prev?x.kg-prev.kg:0;return `<div class="list-item" style="padding:9px 0"><span class="muted small">${dFmt(x.t,{day:'2-digit',month:'2-digit',year:'2-digit'})}</span><span><b>${fmt(x.kg,2)} kg</b>${prev?` <span class="small" style="color:${d>0?'var(--acc)':'var(--red)'}">${d>0?'+':''}${fmt(d,2)}</span>`:' <span class="muted small">Start</span>'}</span></div>`}).join('')}</div>`:''}
    ${ss.length?'<div class="sect tiny">Alle Trainings</div>':''}
    <div class="card" ${ss.length?'':'hidden'}>${[...ss].reverse().map(x=>{const h=hl?hl(x):null;return `<div class="list-item" style="align-items:flex-start"><span class="muted small" style="white-space:nowrap">${dFmt(x.t,{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'})}</span>
      <span class="small" style="text-align:right">${x.sets.map(s=>s===h?`<b style="color:var(--acc)">${setTxt(s)}</b>`:setTxt(s)).join(' · ')}</span></div>`}).join('')}</div>`;
  v.querySelectorAll('[data-pm]').forEach(c=>c.onclick=()=>{progressMetric=c.dataset.pm;renderExercise()});
  drawChart($('#pchart'),series,unit);
}

/* ================= Diagramm ================= */
function drawChart(c,series,unit=''){
  const dpr=window.devicePixelRatio||1,W=c.clientWidth||320,H=200;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const g=c.getContext('2d');g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement),cv=x=>x.startsWith('var(')?css.getPropertyValue(x.slice(4,-1)).trim():x;
  const acc=cv('var(--acc)'),muted=cv('var(--muted)'),line=cv('var(--line)');
  series=series.map(x=>({...x,color:cv(x.color||'var(--acc)')})).filter(x=>x.pts.length);
  const all=series.flatMap(x=>x.pts);
  g.font='11px system-ui';g.fillStyle=muted;
  const ts=[...new Set(all.map(p=>p.t))];
  if(ts.length<2){g.textAlign='center';g.fillText(all.length?'Ab dem 2. Training gibt es eine Kurve':'Keine Daten',W/2,H/2);return}
  const pl=40,pr=10,pt=14,pb=24;
  let lo=Math.min(...all.map(p=>p.v)),hi=Math.max(...all.map(p=>p.v));if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const t0=Math.min(...ts),t1=Math.max(...ts);
  const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  g.strokeStyle=line;g.lineWidth=1;g.textAlign='right';g.textBaseline='middle';
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);g.beginPath();g.moveTo(pl,y);g.lineTo(W-pr,y);g.stroke();g.fillText(fmt(v,0),pl-6,y)}
  g.textBaseline='top';
  [t0,(t0+t1)/2,t1].forEach((t,i)=>{g.textAlign=['left','center','right'][i];g.fillText(dFmt(t,{day:'2-digit',month:'2-digit'}),i===0?pl:i===2?W-pr:X(t),H-pb+8)});
  series.forEach((sr,si)=>{const pts=[...sr.pts].sort((a,b)=>a.t-b.t);
    if(series.length===1){const grad=g.createLinearGradient(0,pt,0,H-pb);grad.addColorStop(0,acc+'55');grad.addColorStop(1,acc+'00');
      g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p.t),Y(p.v)):g.moveTo(X(p.t),Y(p.v)));g.lineTo(X(pts[pts.length-1].t),H-pb);g.lineTo(X(pts[0].t),H-pb);g.closePath();g.fillStyle=grad;g.fill()}
    g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p.t),Y(p.v)):g.moveTo(X(p.t),Y(p.v)));g.strokeStyle=sr.color;g.lineWidth=2.5;g.lineJoin='round';g.stroke();
    g.fillStyle=sr.color;pts.forEach(p=>{g.beginPath();g.arc(X(p.t),Y(p.v),3,0,7);g.fill()});
    if(series.length===1){const l=pts[pts.length-1];g.fillStyle=cv('var(--text)');g.font='600 12px system-ui';g.textAlign='right';g.textBaseline='bottom';g.fillText(fmt(l.v)+unit,W-pr,Y(l.v)-6>12?Y(l.v)-6:Y(l.v)+18)}
  });
}

  if(PAGES.length)return PAGES[PAGES.length-1]();
  const v=$('#view');const ci=cycleIdx();
  v.innerHTML=`
    <div class="sect row between"><span class="tiny">Trainingsplan · ${S.cycle.days.length}-Tage-Zyklus</span>${S.cycle.days.length>1?'<span class="muted small">⠿ halten & ziehen</span>':''}</div>
    <div class="card" style="padding:4px 10px" id="clist">${S.cycle.days.map((d,i)=>{const l=cycleLabel(d);return dragRow(`<div class="drow-main" data-day="${i}"><div><span class="muted small">Tag ${i+1}${i===ci?' · <span style="color:var(--acc)">heute</span>':''}</span><div>${l.emoji} ${esc(l.name)}</div>${l.t?`<div class="muted small">${l.t.items.length} Übungen</div>`:''}</div></div><span class="muted" style="font-size:20px">›</span>`)}).join('')}</div>

    <div class="card" style="padding:4px 14px"><div class="list-item" id="openLib" style="cursor:pointer"><span>Alle Übungen <span class="muted">(${S.exercises.length})</span></span><span class="muted" style="font-size:20px">›</span></div></div>
    <div class="sect tiny">Einstellungen</div>
    <div class="card" style="padding:4px 14px"><div class="list-item"><span>Pausentimer</span><select class="f" id="rest" style="width:auto">${[0,45,60,90,120,150,180,240,300].map(s=>`<option value="${s}" ${S.settings.rest===s?'selected':''}>${s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' min':'aus'}</option>`).join('')}</select></div></div>
    <div class="sect tiny">Daten-Backup</div>
    <div class="card"><div class="muted small" style="margin-bottom:10px">Alle Daten liegen nur auf diesem Gerät. Exportiere regelmäßig ein Backup (z. B. in iCloud/Drive). App-Updates löschen keine Daten.</div>
      <div class="grid2"><button class="btn" id="exp">Exportieren</button><button class="btn" id="imp">Importieren</button></div>
      <button class="btn block" id="csv" style="margin-top:8px">Als CSV (Excel) exportieren</button>
      <div class="muted small" style="margin-top:8px">${S.lastBackup?'Letztes Backup: '+dFmt(S.lastBackup):'Noch kein Backup gemacht.'}</div></div>
    <button class="btn red block" id="reset" style="margin-top:12px">Alle Daten löschen</button>
    <div class="muted small" style="text-align:center;margin-top:16px">Training · v${APP_VERSION}</div>`;
  // Zyklus umsortieren: der heutige Tag bleibt heute
  sortable($('#clist'),(a,b)=>{const todayPos=cycleIdx();const arr=S.cycle.days.map((d,i)=>({d,i}));const [m]=arr.splice(a,1);arr.splice(b,0,m);
    S.cycle.days=arr.map(x=>x.d);setToday(arr.findIndex(x=>x.i===todayPos));save();render()});
  v.querySelectorAll('[data-day]').forEach(r=>r.onclick=()=>{const i=+r.dataset.day,d=S.cycle.days[i];
    if(d!=='rest'&&S.templates.some(t=>t.id===d))return openPage(dayEditor(d));
    sheet(`<h2>Tag ${i+1}</h2><div style="display:grid;gap:8px">
      ${S.templates.map(t=>`<button class="btn" data-pick="${t.id}" style="justify-content:flex-start">${t.emoji||'🏋️'} ${esc(t.name)}</button>`).join('')}
      <button class="btn" data-pick="rest" style="justify-content:flex-start">😴 Rest Day</button>
      ${S.cycle.days.length>1?'<button class="btn red" id="cRm">Tag aus dem Zyklus entfernen</button>':''}</div>`);
    document.querySelectorAll('#sheet [data-pick]').forEach(b=>b.onclick=()=>{S.cycle.days[i]=b.dataset.pick;save();closeSheet();render()});
    const rm=$('#cRm');if(rm)rm.onclick=()=>{const ci=cycleIdx();S.cycle.days.splice(i,1);setToday(Math.min(ci>i?ci-1:ci,S.cycle.days.length-1));save();closeSheet();render()};

  $('#cAddT').onclick=()=>{const t={id:uid(),name:'Neuer Trainingstag',emoji:'🏋️',items:[]};S.templates.push(t);const ci=cycleIdx();S.cycle.days.push(t.id);setToday(ci);save();openPage(dayEditor(t.id));setTimeout(()=>{const n=$('#dName');n&&(n.focus(),n.select())},100)};
  $('#cAddR').onclick=()=>{const ci=cycleIdx();S.cycle.days.push('rest');setToday(ci);save();render()};
  $('#openLib').onclick=()=>openPage(libraryPage());

  $('#exp').onclick=exportJSON;

  $('#reset').onclick=()=>{if(confirm('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.')&&confirm('Sicher? Vorher besser ein Backup exportieren.')){localStorage.removeItem(KEY);load();render();toast('Zurückgesetzt')}};
}
function download(name,text,type){
  const blob=new Blob([text],{type});
  const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportJSON(){
  S.lastBackup=Date.now();save();
  download(`training-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1),'application/json');
}
function exportCSV(){
  const rows=[['Datum','Training','Übung','Muskelgruppe','Satz','Typ','kg','Wdh']];
  for(const w of S.workouts)for(const e of w.exercises){let n=0;for(const s of e.sets){const ex=exById(e.exId);rows.push([new Date(w.start).toISOString().slice(0,10),w.name,ex.name,ex.muscle,s.type==='w'?'W':s.type==='d'?'D':++n,s.type==='w'?'Aufwärmen':s.type==='d'?'Dropsatz':'Arbeitssatz',String(s.kg).replace('.',','),s.reps])}}
  download(`training-${new Date().toISOString().slice(0,10)}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');
}
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.workouts)||!Array.isArray(d.exercises))throw 0;
    if(!confirm(`Backup mit ${d.workouts.length} Trainings laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.`))return;
    S=d;save();load();render();toast('Backup geladen');
  }catch(err){toast('Datei ist kein gültiges Backup')}
});

/* ================= Sheet ================= */
function sheet(html){$('#sheetBody').innerHTML=html;$('#sheetBg').classList.add('show');$('#sheet').classList.add('show');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheetBg').classList.remove('show');$('#sheet').classList.remove('show')}
$('#sheetBg').onclick=closeSheet;

/* ================= Start ================= */
load();
try{const t=sessionStorage.getItem('tab');if(t&&TITLES[t])tab=t}catch(e){}
if(S.active)tab='workout';
render();
let lastW=innerWidth;window.addEventListener('resize',()=>{if(innerWidth!==lastW&&tab==='progress'&&!document.activeElement.matches('input,textarea')){lastW=innerWidth;render()}});
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload()}});
}
// Beim Öffnen/Zurückkehren prüfen, ob es eine neue Version gibt, und dann automatisch neu laden
async function checkUpdate(){
  if(location.protocol!=='https:')return;
  try{const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION&&!document.querySelector('#sheet.show'))location.reload()}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
checkUpdate();
// Persistenten Speicher anfragen, damit der Browser Daten nicht automatisch löscht
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
