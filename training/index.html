<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Training</title>
<style>
:root{
  --bg:#0e0f12;--card:#17191e;--card2:#1f2229;--line:#2a2e37;--text:#eef0f4;--muted:#8b919e;
  --acc:#c6f432;--acc-ink:#11140a;--red:#ff5d5d;--blue:#5db4ff;--gold:#ffc94a;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-t);padding-bottom:calc(76px + var(--safe-b));min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header.top{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid transparent}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
header.top .sub{color:var(--muted);font-size:13px}
main{padding:8px 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--card2);font-weight:600;min-height:46px}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.red{background:rgba(255,93,93,.14);color:var(--red)}
.btn.ghost{background:transparent;color:var(--muted);padding:8px 10px;min-height:0}
.btn.block{width:100%}
.btn:active{transform:scale(.98);opacity:.85}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--muted)}
.pill.pr{background:rgba(255,201,74,.15);color:var(--gold);font-weight:700}
input.f,select.f,textarea.f{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;letter-spacing:-.01em}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,20,24,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
/* workout */
.ex{background:var(--card);border-radius:var(--r);padding:12px 12px 8px;margin-bottom:12px}
.ex h3{margin:0;font-size:17px}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets td.n{width:30px;color:var(--muted);font-weight:700}
.sets td.prev{color:var(--muted);font-size:13px;width:72px}
.sets input{width:100%;max-width:74px;text-align:center;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:9px 2px;font-weight:600;outline:none;-moz-appearance:textfield}
.sets input:focus{border-color:var(--acc)}
.sets input::-webkit-outer-spin-button,.sets input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:38px;height:38px;border-radius:10px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.chk.on{background:var(--acc);color:var(--acc-ink)}
tr.done input{background:rgba(198,244,50,.10);color:var(--acc)}
.settype{font-size:11px;font-weight:800;border-radius:6px;padding:2px 0;display:inline-block;width:24px}
.settype.w{color:var(--gold)}
.settype.d{color:var(--blue)}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:8px}
/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));z-index:40;background:var(--acc);color:var(--acc-ink);border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:616px;margin:0 auto}
#timer.show{display:flex}
#timer b{font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:rgba(0,0,0,.12);border-radius:10px;padding:8px 11px;font-weight:700;color:var(--acc-ink)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 12px;font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--card2);font-size:14px;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);font-weight:600}
canvas{width:100%;display:block}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(calc(-100% - 60px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.hist-ex{font-size:14px;color:var(--muted);margin-top:4px}
.sect{margin:18px 2px 8px}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
</style>
</head>
<body>
<header class="top"><div><h1 id="title">Training</h1><div class="sub" id="subtitle"></div></div><div id="hdrAct"></div></header>
<main id="view"></main>

<div id="timer"><div><div class="small" style="font-weight:600;opacity:.75">Pause</div><b id="timerTxt">0:00</b></div><div class="row"><button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="x">Skip</button></div></div>

<nav class="tabs" id="tabs">
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Verlauf</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Fortschritt</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><path d="M5 9h14M12 9v6M9 21l3-6 3 6"/></svg>Körper</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mehr</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= Daten ================= */
const KEY='training.v1';
const MUSCLES=['Brust','Obere Brust','Rücken','Latissimus','Unterer Rücken','Schultern','Hintere Schulter','Bizeps','Trizeps','Quadrizeps','Beinbeuger','Adduktoren','Po','Waden','Bauch','Unterarme','Ganzkörper','Cardio'];
/* Dein Plan: [Name, Muskelgruppe, Sätze, Wdh min, Wdh max, kg] */
const PLAN=[
 {name:'Brust & Rücken',emoji:'🏋️',items:[
  ['Flat Smith Machine','Brust',2,8,10,100],['Latziehen','Latissimus',2,8,10,110],['Incline Smith Machine','Obere Brust',2,8,10,92.5],
  ['Rudern Kabelturm','Rücken',2,8,10,105],['Flys Maschine','Brust',2,12,15,75],['Enges Rudern','Rücken',2,8,10,85],
  ['Flys Kabelturm','Brust',1,'','',45,{amrap:true,drops:[20]}],['Latzug einarmig','Latissimus',2,8,10,85]]},
 {name:'Arme & Schultern',emoji:'💪',items:[
  ['Seitheben Maschine','Schultern',3,12,15,70],['Reverse Flys Maschine','Hintere Schulter',3,15,20,60],['Hammer Curls','Bizeps',2,8,10,20],
  ['Pushdowns','Trizeps',3,10,12,105],['Preacher Curls','Bizeps',2,10,12,36.25],['Trizeps Überkopf','Trizeps',3,10,12,80],
  ['Seitheben Kurzhantel','Schultern',3,12,15,14],['Reverse Flys Kurzhantel','Hintere Schulter',3,15,20,10],['Bizeps Curls Kabel','Bizeps',2,8,10,32.5]]},
 {name:'Beine & Core',emoji:'🧱',items:[
  ['Adduktoren Maschine','Adduktoren',2,8,10,90],['Leg Curls','Beinbeuger',2,8,10,85],['Hack Squat','Quadrizeps',2,8,10,75],
  ['Beinstrecker','Quadrizeps',3,8,10,90],['Cable Crunches','Bauch',4,12,15,90],['Rückenstrecker','Unterer Rücken',2,10,12,55]]}
];
const DEFAULT_EX=[
 ['Bankdrücken (Langhantel)','Brust'],['Schrägbankdrücken (Kurzhantel)','Obere Brust'],['Bankdrücken (Kurzhantel)','Brust'],['Brustpresse (Maschine)','Brust'],
 ['Klimmzüge','Latissimus'],['Langhantelrudern','Rücken'],['Kurzhantelrudern einarmig','Rücken'],['T-Bar Rudern','Rücken'],['Kreuzheben','Unterer Rücken'],['Face Pulls','Hintere Schulter'],['Shrugs','Rücken'],
 ['Schulterdrücken (Kurzhantel)','Schultern'],['Military Press','Schultern'],['Seitheben (Kabel)','Schultern'],
 ['Langhantelcurls','Bizeps'],['Kurzhantelcurls','Bizeps'],['French Press','Trizeps'],['Enges Bankdrücken','Trizeps'],['Dips','Trizeps'],
 ['Kniebeugen','Quadrizeps'],['Beinpresse','Quadrizeps'],['Beinbeuger sitzend','Beinbeuger'],['Rumänisches Kreuzheben','Beinbeuger'],['Ausfallschritte','Quadrizeps'],['Bulgarian Split Squats','Quadrizeps'],
 ['Hip Thrust','Po'],['Abduktoren Maschine','Po'],
 ['Wadenheben stehend','Waden'],['Wadenheben sitzend','Waden'],
 ['Beinheben hängend','Bauch'],['Plank','Bauch'],
 ['Laufband','Cardio'],['Crosstrainer','Cardio'],['Stairmaster','Cardio']
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function defaults(){
  const exercises=[];
  const add=(name,muscle)=>{let e=exercises.find(x=>x.name===name);if(!e){e={id:uid(),name,muscle};exercises.push(e)}return e.id};
  const templates=PLAN.map(p=>({id:uid(),name:p.name,emoji:p.emoji,items:p.items.map(([n,m,sets,rMin,rMax,kg,x])=>Object.assign({exId:add(n,m),sets,rMin,rMax,kg},x||{}))}));
  DEFAULT_EX.forEach(([n,m])=>add(n,m));
  const bench=exercises.find(e=>e.name==='Bankdrücken (Langhantel)').id;
  return {version:2,exercises,workouts:[],templates,body:[],active:null,
    prs:[{id:uid(),exId:bench,kg:130,reps:1,t:new Date(2026,6,6,12).getTime(),note:'Bench Press PR'}],
    cycle:{days:[templates[0].id,templates[1].id,templates[2].id,'rest'],anchor:'2026-10-19',anchorIdx:0},cycleFix:1,
    settings:{rest:120,unit:'kg'}};
}
let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.exercises)){S=defaults();save()}
  const d=defaults();
  for(const k of ['workouts','templates','body','exercises'])if(!Array.isArray(S[k]))S[k]=d[k];
  if(!Array.isArray(S.prs))S.prs=[];
  if(!S.cycle)S.cycle={days:S.templates.slice(0,3).map(t=>t.id).concat('rest'),anchor:isoDay(new Date()),anchorIdx:0};
  // Fixpunkt: 19.10.2026 = Brust & Rücken (Tag 1)
  if(!S.flyFix){S.flyFix=1;const fe=S.exercises.find(e=>e.name==='Flys Kabelturm');if(fe)S.templates.forEach(t=>t.items.forEach(i=>{if(i.exId===fe.id)Object.assign(i,{sets:1,rMin:'',rMax:'',kg:45,amrap:true,drops:[20]})}));save()}
  if(S.cycleFix!==1){S.cycle.anchor='2026-10-19';S.cycle.anchorIdx=0;S.cycleFix=1;save()}
  S.settings=Object.assign({},d.settings,S.settings||{});
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern fehlgeschlagen!')}
}
const exById=id=>S.exercises.find(e=>e.id===id)||{name:'(gelöschte Übung)',muscle:''};

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmt=(n,d=1)=>{n=Math.round(n*10**d)/10**d;return n.toLocaleString('de-AT',{maximumFractionDigits:d})};
const e1rm=(w,r)=>r>0&&w>0?(r===1?w:w*(1+r/30)):0;
const dFmt=(t,o={weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'})=>new Date(t).toLocaleDateString('de-AT',o);
const tFmt=t=>new Date(t).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
function dur(ms){const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const ICON={
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>'
};

/* Letzte Sätze einer Übung (aus abgeschlossenen Trainings) */
function lastSets(exId,beforeTs=Infinity){
  for(let i=S.workouts.length-1;i>=0;i--){
    const w=S.workouts[i];if(w.start>=beforeTs)continue;
    const ex=w.exercises.find(e=>e.exId===exId);
    if(ex&&ex.sets.some(s=>s.done))return ex.sets.filter(s=>s.done);
  }
  return null;
}
function bestE1rm(exId,beforeTs=Infinity){
  let b=0;for(const p of S.prs||[])if(p.exId===exId&&p.t<beforeTs)b=Math.max(b,e1rm(p.kg,p.reps));
  for(const w of S.workouts){if(w.start>=beforeTs)continue;for(const ex of w.exercises)if(ex.exId===exId)for(const s of ex.sets)if(s.done&&isW(s))b=Math.max(b,e1rm(num(s.kg),num(s.reps)))}
  return b;
}
const isW=s=>!s.type||s.type==='n';
function isoDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayNum(iso){const [y,m,d]=iso.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
function cycleIdx(date=new Date()){const C=S.cycle,n=C.days.length;if(!n)return 0;return(((C.anchorIdx+dayNum(isoDay(date))-dayNum(C.anchor))%n)+n)%n}
function cycleLabel(id){if(id==='rest')return {emoji:'😴',name:'Rest Day'};const t=S.templates.find(x=>x.id===id);return t?{emoji:t.emoji||'🏋️',name:t.name,t}:{emoji:'❔',name:'(gelöschte Vorlage)'}}
function setToday(idx){S.cycle.anchor=isoDay(new Date());S.cycle.anchorIdx=idx;save()}
function workoutStats(w){
  let vol=0,sets=0;
  for(const ex of w.exercises)for(const s of ex.sets)if(s.done){sets++;if(s.type!=='w')vol+=num(s.kg)*num(s.reps)}
  return {vol,sets};
}

/* ================= Navigation ================= */
let tab='workout';
const TITLES={workout:'Training',history:'Verlauf',progress:'Fortschritt',body:'Körper',more:'Mehr'};
function go(t){tab=t;try{sessionStorage.setItem('tab',t)}catch(e){}render();window.scrollTo(0,0)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)go(b.dataset.tab)});
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#title').textContent=TITLES[tab];$('#subtitle').textContent='';$('#hdrAct').innerHTML='';
  ({workout:renderWorkout,history:renderHistory,progress:renderProgress,body:renderBody,more:renderMore})[tab]();
}

/* ================= Training ================= */
let tick=null;
function renderWorkout(){
  clearInterval(tick);
  const A=S.active,v=$('#view');
  if(!A){
    const last=S.workouts[S.workouts.length-1];
    const week=S.workouts.filter(w=>w.start>Date.now()-7*864e5).length;
    const ci=cycleIdx(),today=cycleLabel(S.cycle.days[ci]),next=cycleLabel(S.cycle.days[(ci+1)%S.cycle.days.length]);
    const doneToday=S.workouts.some(w=>isoDay(new Date(w.start))===isoDay(new Date()));
    v.innerHTML=`
      <div class="card" style="background:linear-gradient(135deg,#232a12,#17191e 70%)">
        <div class="row between"><span class="tiny" style="color:var(--acc)">Heute dran · Tag ${ci+1}/${S.cycle.days.length}</span><button class="btn ghost small" id="chgDay" style="padding:4px 6px">ändern</button></div>
        <div class="big" style="margin:6px 0 2px">${today.emoji} ${esc(today.name)}</div>
        <div class="muted small" style="margin-bottom:12px">${today.t?today.t.items.map(i=>esc(exById(i.exId).name)).join(' · '):'Erholung – Muskeln wachsen in der Pause.'}</div>
        ${today.t?`<button class="btn acc block" data-start="${today.t.id}">${doneToday?'Nochmal starten':'Training starten'}</button>`:''}
        <div class="muted small" style="margin-top:10px">Morgen: ${next.emoji} ${esc(next.name)}</div>
      </div>
      <div class="grid2" style="margin-bottom:12px">
        <div class="stat"><span class="tiny">Diese Woche</span><b>${week} Training${week===1?'':'s'}</b></div>
        <div class="stat"><span class="tiny">Zuletzt</span><b>${last?dFmt(last.start,{day:'2-digit',month:'2-digit'}):'–'}</b></div>
      </div>
      <button class="btn block" id="startEmpty">${ICON.plus} Leeres Training starten</button>
      <div class="sect row between"><span class="tiny">Vorlagen</span><button class="btn ghost small" id="newTpl">${ICON.plus} Neu</button></div>
      ${S.templates.length?S.templates.map(t=>`
        <div class="card" data-tpl="${t.id}">
          <div class="row between"><h3 style="margin:0;font-size:17px">${t.emoji?t.emoji+' ':''}${esc(t.name)}</h3><button class="btn ghost" data-tplmenu="${t.id}">${ICON.dots}</button></div>

function newExEntry(exId,n=3,target=null){
  const prev=lastSets(exId);const work=prev&&prev.filter(isW);const prevDrops=prev?prev.filter(s=>s.type==='d'):[];
  const tg=target&&(target.rMax||target.kg!==''||target.amrap)?{rMin:target.rMin,rMax:target.rMax,kg:target.kg,amrap:!!target.amrap,drops:target.drops||[]}:null;
  // Progression: alle Arbeitssätze am oberen Ende der Spanne → Hinweis
  const up=!!(tg&&tg.rMax&&work&&work.length&&work.every(s=>num(s.reps)>=tg.rMax));
  const sets=[];for(let i=0;i<n;i++){
    const p=work&&work.length?work[Math.min(i,work.length-1)]:null;
    const ph=p?{kg:p.kg,reps:p.reps}:tg?{kg:tg.kg,reps:tg.rMax||''}:null;
    sets.push({kg:'',reps:'',done:false,type:'n',ph});
  }
  (tg?tg.drops:[]).forEach((dk,i)=>{const p=prevDrops[i];sets.push({kg:'',reps:'',done:false,type:'d',ph:p?{kg:p.kg,reps:p.reps}:{kg:dk,reps:''}})});
  return {exId,sets,note:'',target:tg,up};
}
const targetTxt=t=>t?[t.amrap?'max. Wdh':t.rMax?(t.rMin&&t.rMin!==t.rMax?`${t.rMin}–${t.rMax} Wdh`:`${t.rMax} Wdh`):'',t.kg!==''&&t.kg!=null?`${fmt(num(t.kg),2)} kg`:'',...(t.drops||[]).map(d=>`Drop → ${fmt(num(d),2)} kg`)].filter(Boolean).join(' · '):'';
function exerciseCard(ex,ei){
  const e=exById(ex.exId);const prev=lastSets(ex.exId,S.active.start);
  let n=0;
  return `<div class="ex" data-ei="${ei}">
    <div class="row between"><div><h3>${esc(e.name)}</h3><div class="muted small">${esc(e.muscle)}${ex.target?` · Ziel ${targetTxt(ex.target)}`:''}</div></div><button class="btn ghost" data-exmenu="${ei}">${ICON.dots}</button></div>
    ${ex.up?`<div class="small" style="color:var(--acc);margin-top:4px">⬆️ Letztes Mal alle Sätze am oberen Ende – Gewicht erhöhen!</div>`:''}
    ${ex.note?`<div class="small" style="color:var(--blue);margin-top:4px">${esc(ex.note)}</div>`:''}
    <table class="sets"><thead><tr><th>Satz</th><th>Zuletzt</th><th>kg</th><th>Wdh</th><th></th></tr></thead><tbody>
    ${ex.sets.map((s,si)=>{const lbl=s.type==='w'?'<span class="settype w">W</span>':s.type==='d'?'<span class="settype d">D</span>':`<span class="settype">${++n}</span>`;
      const p=prev&&prev[si];
      return `<tr class="${s.done?'done':''}" data-si="${si}">
        <td class="n"><button data-type="${si}">${lbl}</button></td>
        <td class="prev">${p?`${fmt(num(p.kg))}×${esc(p.reps)}`:'–'}</td>
        <td><input inputmode="decimal" data-f="kg" value="${esc(s.kg)}" placeholder="${s.ph?esc(s.ph.kg):''}"></td>
        <td><input inputmode="numeric" data-f="reps" value="${esc(s.reps)}" placeholder="${s.ph?esc(s.ph.reps):''}"></td>
        <td><button class="chk ${s.done?'on':''}" data-done="${si}">${ICON.check}</button></td></tr>`}).join('')}
    </tbody></table>
    <button class="btn ghost block small" data-addset="${ei}">${ICON.plus} Satz</button>
  </div>`;
}
function bindWorkout(v){
  const A=S.active;
  v.querySelectorAll('.ex').forEach(card=>{
    const ei=+card.dataset.ei,ex=A.exercises[ei];
    card.querySelectorAll('tr[data-si]').forEach(tr=>{
      const si=+tr.dataset.si;
      tr.querySelectorAll('input').forEach(inp=>{
        inp.oninput=()=>{ex.sets[si][inp.dataset.f]=inp.value.replace(',','.');save()};
        inp.onfocus=()=>inp.select();
      });
    });
    card.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
      const si=+b.dataset.done,s=ex.sets[si];
      if(!s.done){
        if(s.kg===''&&s.ph)s.kg=s.ph.kg;
        if(s.reps===''&&s.ph)s.reps=s.ph.reps;
        if(s.reps===''){toast('Bitte Wiederholungen eintragen');return}
        s.done=true;vib(30);
        if(isW(s)){const b4=bestE1rm(ex.exId,A.start);const cur=e1rm(num(s.kg),num(s.reps));
          const inSession=ex.sets.filter((x,i)=>i!==si&&x.done&&isW(x)).reduce((m,x)=>Math.max(m,e1rm(num(x.kg),num(x.reps))),0);
          if(b4>0&&cur>b4&&cur>inSession){toast('🏆 Neuer Rekord!');vib([40,60,40])}}
        const nx=ex.sets[si+1];
        if(nx&&nx.type==='d'&&!nx.done){stopTimer();toast('Sofort droppen! ⬇️');setTimeout(()=>{const i=document.querySelector(`.ex[data-ei="${ei}"] tr[data-si="${si+1}"] input[data-f="reps"]`);i&&i.focus()},80)}
        else startTimer(S.settings.rest);
      }else s.done=false;
      save();renderWorkout();
    });
    card.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const s=ex.sets[+b.dataset.type];s.type=s.type==='w'?'d':s.type==='d'?'n':'w';save();renderWorkout()});
    card.querySelector('[data-addset]').onclick=()=>{const last=ex.sets[ex.sets.length-1];ex.sets.push({kg:last?last.kg:'',reps:last?last.reps:'',done:false,type:'n',ph:last?last.ph:null});save();renderWorkout()};
    card.querySelector('[data-exmenu]').onclick=()=>exerciseMenu(ei);
  });
}

function startWorkout(tplId){
  if(S.active&&!confirm('Es läuft schon ein Training. Ersetzen?'))return;
  const t=S.templates.find(x=>x.id===tplId);
  S.active={id:uid(),name:t?t.name:'Training',start:Date.now(),tplId:t?t.id:null,note:'',exercises:t?t.items.filter(i=>S.exercises.some(e=>e.id===i.exId)).map(i=>newExEntry(i.exId,i.sets,i)):[]};
  save();renderWorkout();
}
function finishWorkout(){
  const A=S.active;
  const exs=A.exercises.map(ex=>({exId:ex.exId,note:ex.note||'',sets:ex.sets.filter(s=>s.done).map(({kg,reps,type})=>({kg:num(kg),reps:num(reps),type,done:true}))})).filter(ex=>ex.sets.length);
  if(!exs.length){if(confirm('Kein Satz abgehakt. Training trotzdem beenden (wird nicht gespeichert)?')){S.active=null;save();stopTimer();renderWorkout()}return}
  const open=A.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>!s.done).length,0);
  if(open&&!confirm(`${open} Satz/Sätze nicht abgehakt – die werden nicht gespeichert. Beenden?`))return;
  // PRs zählen
  let prs=0;for(const ex of exs){const b=bestE1rm(ex.exId,A.start);const c=Math.max(0,...ex.sets.filter(isW).map(s=>e1rm(s.kg,s.reps)));if(b>0&&c>b)prs++}
  const w={id:A.id,name:A.name,start:A.start,end:Date.now(),note:A.note||'',exercises:exs,prs};
  S.workouts.push(w);S.workouts.sort((a,b)=>a.start-b.start);
  S.active=null;save();stopTimer();
  const st=workoutStats(w);
  sheet(`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:48px">💪</div><h2 style="margin:6px 0 2px">Stark, Training gespeichert</h2><div class="muted">${esc(w.name)} · ${dur(w.end-w.start)}</div></div>
    <div class="grid3" style="margin:16px 0"><div class="stat"><span class="tiny">Sätze</span><b>${st.sets}</b></div><div class="stat"><span class="tiny">Volumen</span><b>${fmt(st.vol/1000,1)} t</b></div><div class="stat"><span class="tiny">Rekorde</span><b>${prs}</b></div></div>
    ${w.tplId?'':`<button class="btn block" id="asTpl" style="margin-bottom:8px">Als Vorlage speichern</button>`}
    <button class="btn acc block" id="ok">Fertig</button>`);
  $('#ok').onclick=()=>{closeSheet();renderWorkout()};
  const at=$('#asTpl');if(at)at.onclick=()=>{saveAsTemplate(w);closeSheet();renderWorkout()};
  renderWorkout();
}
function saveAsTemplate(w){
  const name=prompt('Name der Vorlage',w.name==='Training'?'':w.name);if(!name)return;
  S.templates.push({id:uid(),name,items:w.exercises.map(e=>{const ws=e.sets.filter(isW);const r=ws.map(s=>num(s.reps));return {exId:e.exId,sets:ws.length||3,drops:e.sets.filter(s=>s.type==='d').map(s=>num(s.kg)),rMin:r.length?Math.min(...r):'',rMax:r.length?Math.max(...r):'',kg:ws.length?Math.max(...ws.map(s=>num(s.kg))):''}})});save();toast('Vorlage gespeichert');
}

/* ================= Verlauf ================= */
function renderHistory(){
  const v=$('#view');
  if(!S.workouts.length){v.innerHTML=`<div class="empty">${ICON.dumb}<div>Noch keine Trainings.<br>Starte dein erstes im Tab „Training“.</div></div>`;return}
  $('#subtitle').textContent=`${S.workouts.length} Trainings insgesamt`;
  // Wochen-Übersicht (letzte 12 Wochen)
  const now=new Date();const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)).getTime();
  const weeks=Array.from({length:12},(_,i)=>{const s=monday-(11-i)*7*864e5;return S.workouts.filter(w=>w.start>=s&&w.start<s+7*864e5).length});
  const mx=Math.max(1,...weeks);
  let html=`<div class="card"><div class="tiny" style="margin-bottom:8px">Trainings pro Woche (12 Wochen)</div>

/* ================= Fortschritt ================= */
let progressEx=null,progressMetric='e1rm';
function renderProgress(){
  const v=$('#view');
  $('#hdrAct').innerHTML=`<button class="btn ghost small" id="addPR">${ICON.plus} Rekord</button>`;$('#addPR').onclick=()=>addManualPR();
  const used=[...new Set(S.workouts.flatMap(w=>w.exercises.map(e=>e.exId)).concat(S.prs.map(p=>p.exId)))].filter(id=>S.exercises.some(e=>e.id===id));
  if(!used.length){v.innerHTML=`<div class="empty">${ICON.dumb}<div>Sobald du trainiert hast, siehst du hier deine Kurven und Rekorde.</div></div>`;return}
  if(!used.includes(progressEx)){
    const cnt={};S.workouts.forEach(w=>w.exercises.forEach(e=>cnt[e.exId]=(cnt[e.exId]||0)+1));
    progressEx=used.sort((a,b)=>(cnt[b]||0)-(cnt[a]||0))[0];
  }
  const sessions=S.workouts.filter(w=>w.exercises.some(e=>e.exId===progressEx)).map(w=>{
    const sets=w.exercises.filter(e=>e.exId===progressEx).flatMap(e=>e.sets).filter(isW);
    return {t:w.start,e1rm:Math.max(0,...sets.map(s=>e1rm(s.kg,s.reps))),top:Math.max(0,...sets.map(s=>s.kg)),vol:sets.reduce((a,s)=>a+s.kg*s.reps,0),reps:Math.max(0,...sets.map(s=>s.reps)),sets};
  }).filter(s=>s.sets.length);
  // eingetragene Rekorde fließen als eigene Punkte ein
  S.prs.filter(p=>p.exId===progressEx).forEach(p=>sessions.push({t:p.t,e1rm:e1rm(p.kg,p.reps),top:p.kg,vol:0,reps:p.reps,sets:[{kg:p.kg,reps:p.reps}],manual:true}));
  sessions.sort((a,b)=>a.t-b.t);
  const best=k=>sessions.reduce((m,s)=>s[k]>m[k]?s:m,sessions[0]);
  const myPRs=S.prs.filter(p=>p.exId===progressEx);
  // Rekord je Wiederholungszahl
  const repPR={};sessions.forEach(s=>s.sets.forEach(x=>{if(x.reps>=1&&x.reps<=12&&(!repPR[x.reps]||x.kg>repPR[x.reps].kg))repPR[x.reps]={kg:x.kg,t:s.t}}));
  const bw=best('e1rm'),bt=best('top');
  v.innerHTML=`
    <select class="f" id="pex" style="margin-bottom:12px">${used.map(id=>exById(id)).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(e=>`<option value="${e.id}" ${e.id===progressEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <div class="grid2" style="margin-bottom:12px">
      <div class="stat"><span class="tiny">Bestes 1RM (geschätzt)</span><b>${fmt(bw.e1rm)} kg</b><span class="muted small">${dFmt(bw.t)}</span></div>
      <div class="stat"><span class="tiny">Schwerstes Gewicht</span><b>${fmt(bt.top)} kg</b><span class="muted small">${dFmt(bt.t)}</span></div>
    </div>
    <div class="card">
      <div class="chips" style="margin-bottom:8px">${[['e1rm','1RM'],['top','Top-Gewicht'],['vol','Volumen'],['reps','Max. Wdh']].map(([k,l])=>`<button class="chip ${progressMetric===k?'on':''}" data-pm="${k}">${l}</button>`).join('')}</div>
      <canvas id="pchart" height="200"></canvas>
    </div>
    <div class="sect tiny">Rekorde nach Wiederholungen</div>
    <div class="card">${Object.keys(repPR).sort((a,b)=>a-b).map(r=>`<div class="list-item"><span>${r} Wdh</span><span><b>${fmt(repPR[r].kg)} kg</b> <span class="muted small">· ${dFmt(repPR[r].t,{day:'2-digit',month:'2-digit',year:'2-digit'})}</span></span></div>`).join('')||'<span class="muted">–</span>'}</div>
    <div class="sect tiny">Letzte Einheiten</div>
    <div class="card">${[...sessions].reverse().slice(0,10).map(s=>`<div class="list-item" style="align-items:flex-start"><span class="muted small" style="white-space:nowrap">${dFmt(s.t,{day:'2-digit',month:'2-digit',year:'2-digit'})}</span><span class="small" style="text-align:right">${s.sets.map(x=>`${fmt(x.kg)}×${x.reps}`).join(', ')}</span></div>`).join('')}</div>
    <div class="sect tiny">Alle Rekorde</div>
    <div class="card" id="allpr"></div>`;
  $('#pex').onchange=e=>{progressEx=e.target.value;renderProgress()};
  v.querySelectorAll('[data-pm]').forEach(c=>c.onclick=()=>{progressMetric=c.dataset.pm;renderProgress()});
  const unit=progressMetric==='reps'?'':' kg';
  drawChart($('#pchart'),sessions.filter(s=>!(s.manual&&progressMetric==='vol')).map(s=>({t:s.t,v:s[progressMetric]})),unit);
  if(myPRs.length){$('#pchart').closest('.card').insertAdjacentHTML('afterend',`<div class="sect tiny">Eingetragene Rekorde</div><div class="card">${myPRs.map(p=>`<div class="list-item"><span>🏆 <b>${fmt(p.kg,2)} kg × ${p.reps}</b>${p.note?` <span class="muted small">· ${esc(p.note)}</span>`:''}<div class="muted small">${dFmt(p.t)}</div></span><button class="btn ghost" data-prdel="${p.id}" style="color:var(--red)">✕</button></div>`).join('')}</div>`);
    v.querySelectorAll('[data-prdel]').forEach(b=>b.onclick=()=>{if(confirm('Rekord löschen?')){S.prs=S.prs.filter(x=>x.id!==b.dataset.prdel);save();renderProgress()}})}
  // Alle Übungen: bestes 1RM
  const all=used.map(id=>{let b=0,t=0;S.workouts.forEach(w=>w.exercises.forEach(e=>{if(e.exId===id)e.sets.forEach(s=>{if(!isW(s))return;const x=e1rm(s.kg,s.reps);if(x>b){b=x;t=w.start}})}));S.prs.forEach(p=>{if(p.exId===id&&e1rm(p.kg,p.reps)>b){b=e1rm(p.kg,p.reps);t=p.t}});return {id,b,t}}).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  $('#allpr').innerHTML=all.map(x=>`<div class="list-item" data-pe="${x.id}" style="cursor:pointer"><span>${esc(exById(x.id).name)}</span><span><b>${fmt(x.b)} kg</b></span></div>`).join('');
  $('#allpr').querySelectorAll('[data-pe]').forEach(r=>r.onclick=()=>{progressEx=r.dataset.pe;renderProgress();window.scrollTo(0,0)});
}

/* ================= Diagramm ================= */
function drawChart(c,pts,unit=''){
  const dpr=window.devicePixelRatio||1,W=c.clientWidth||320,H=200;
  c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';const g=c.getContext('2d');g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement);const acc=css.getPropertyValue('--acc').trim(),muted=css.getPropertyValue('--muted').trim(),line=css.getPropertyValue('--line').trim();
  g.font='11px system-ui';g.fillStyle=muted;
  if(pts.length<2){g.textAlign='center';g.fillText(pts.length?`${fmt(pts[0].v)}${unit} – ab der 2. Einheit gibt es eine Kurve`:'Keine Daten',W/2,H/2);return}
  const pl=40,pr=10,pt=14,pb=24;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>pl+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  g.strokeStyle=line;g.lineWidth=1;g.textAlign='right';g.textBaseline='middle';
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);g.beginPath();g.moveTo(pl,y);g.lineTo(W-pr,y);g.stroke();g.fillText(fmt(v,0),pl-6,y)}
  g.textAlign='center';g.textBaseline='top';
  [t0,(t0+t1)/2,t1].forEach((t,i)=>{g.textAlign=['left','center','right'][i];g.fillText(dFmt(t,{day:'2-digit',month:'2-digit'}),i===0?pl:i===2?W-pr:X(t),H-pb+8)});
  const grad=g.createLinearGradient(0,pt,0,H-pb);grad.addColorStop(0,acc+'55');grad.addColorStop(1,acc+'00');
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p.t),Y(p.v)):g.moveTo(X(p.t),Y(p.v)));g.lineTo(X(t1),H-pb);g.lineTo(X(t0),H-pb);g.closePath();g.fillStyle=grad;g.fill();
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p.t),Y(p.v)):g.moveTo(X(p.t),Y(p.v)));g.strokeStyle=acc;g.lineWidth=2.5;g.lineJoin='round';g.stroke();
  g.fillStyle=acc;pts.forEach(p=>{g.beginPath();g.arc(X(p.t),Y(p.v),3,0,7);g.fill()});
  const last=pts[pts.length-1];g.fillStyle=css.getPropertyValue('--text').trim();g.font='600 12px system-ui';g.textAlign='right';g.textBaseline='bottom';g.fillText(fmt(last.v)+unit,W-pr,Y(last.v)-6>12?Y(last.v)-6:Y(last.v)+18);
}

function manageExercises(){

    sheet(`<h2>Übungen</h2><button class="btn acc block" id="mxnew" style="margin-bottom:10px">${ICON.plus} Neue Übung</button>
      <div class="chips" style="margin-bottom:6px"><button class="chip ${!muscle?'on':''}" data-m="">Alle</button>${MUSCLES.map(m=>`<button class="chip ${muscle===m?'on':''}" data-m="${m}">${m}</button>`).join('')}</div>
      ${S.exercises.filter(e=>!muscle||e.muscle===muscle).sort((a,b)=>a.name.localeCompare(b.name,'de')).map(e=>`<div class="list-item" data-e="${e.id}" style="cursor:pointer"><div>${esc(e.name)}<div class="muted small">${esc(e.muscle)}</div></div><span class="muted small">Bearbeiten</span></div>`).join('')}`);
    $('#mxnew').onclick=()=>newExercise('',muscle,()=>draw());
    document.querySelectorAll('#sheet .chip').forEach(c=>c.onclick=()=>{muscle=c.dataset.m;draw()});
    document.querySelectorAll('#sheet [data-e]').forEach(r=>r.onclick=()=>newExercise('','',()=>draw(),r.dataset.e));
  };
  draw();
}
function download(name,text,type){
  const blob=new Blob([text],{type});
  const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportJSON(){
  S.lastBackup=Date.now();save();
  download(`training-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1),'application/json');
}
function exportCSV(){
  const rows=[['Datum','Training','Übung','Muskelgruppe','Satz','Typ','kg','Wdh','1RM geschätzt']];
  for(const w of S.workouts)for(const e of w.exercises){let n=0;for(const s of e.sets){const ex=exById(e.exId);rows.push([new Date(w.start).toISOString().slice(0,10),w.name,ex.name,ex.muscle,s.type==='w'?'W':s.type==='d'?'D':++n,s.type==='w'?'Aufwärmen':s.type==='d'?'Dropsatz':'Arbeitssatz',String(s.kg).replace('.',','),s.reps,!isW(s)?'':fmt(e1rm(s.kg,s.reps)).replace(/\./g,'')])}}
  download(`training-${new Date().toISOString().slice(0,10)}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');
}
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.workouts)||!Array.isArray(d.exercises))throw 0;
    if(!confirm(`Backup mit ${d.workouts.length} Trainings laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.`))return;
    S=d;save();load();render();toast('Backup geladen');
  }catch(err){toast('Datei ist kein gültiges Backup')}
});

/* ================= Sheet ================= */
function sheet(html){$('#sheetBody').innerHTML=html;$('#sheetBg').classList.add('show');$('#sheet').classList.add('show');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheetBg').classList.remove('show');$('#sheet').classList.remove('show')}
$('#sheetBg').onclick=closeSheet;

/* ================= Start ================= */
load();
try{const t=sessionStorage.getItem('tab');if(t&&TITLES[t])tab=t}catch(e){}
if(S.active)tab='workout';
render();
let lastW=innerWidth;window.addEventListener('resize',()=>{if(innerWidth!==lastW&&(tab==='progress'||tab==='body')&&!document.activeElement.matches('input,textarea')){lastW=innerWidth;render()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
// Persistenten Speicher anfragen, damit der Browser Daten nicht automatisch löscht
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
